# lefthook configuration -- fast, cross-language Git hooks manager.
#
# Install:  go install github.com/evilmartians/lefthook@latest
#           or via npm/cargo/homebrew: https://github.com/evilmartians/lefthook
# Setup:    lefthook install
# Run all:  lefthook run pre-commit --all-files

pre-commit:
  parallel: true
  commands:
    catalog-validate:
      run: uv run --no-project scripts/validate.py
    catalog-reference-current:
      run: uv run --no-project scripts/build_reference.py --check
    review-current:
      run: uv run --no-project uphold_check.py --review --check
    catalog-tests:
      run: uv run --no-project python -m unittest discover -s tests
    uphold-check:
      run: cargo run --quiet -- check
    content-policy:
      run: cargo run --quiet -- scan
    guards:
      run: cargo run --quiet -- guard --stage pre-commit
    engine-tests:
      run: cargo test --quiet
    # The lint profile lives in Cargo.toml, so all three runners hold the crate
    # to the same set. What differs is when a contributor hears about it: a
    # profile only CI reads is one whose first reader is a failed push.
    engine-fmt:
      run: cargo fmt --check
    engine-clippy:
      run: cargo clippy --quiet --all-targets
    # Report rather than fix, which is the one difference from the ruff hook the
    # other two runners get: pre-commit and prek own the staged file after a
    # hook rewrites it, and a linter that edits a file lefthook has already
    # handed to git is a commit that does not contain what was linted.
    ruff-check:
      glob: "*.py"
      run: ruff check {staged_files}
    ruff-format:
      glob: "*.py"
      run: ruff format --check {staged_files}
    actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint {staged_files}
    # The two shell files this repository ships: the consumer harness and the
    # extensionless wrapper a lefthook consumer ran out of the clone, which
    # `*.sh` alone would have missed. That wrapper existed to reach a Python
    # reconciler PATH could not; the reconcile is `uphold check` now, the
    # directory is gone, and the pattern is the plain one again.
    shellcheck:
      glob: "scripts/*.sh"
      run: shellcheck {staged_files}
    bashate:
      glob: "scripts/*.sh"
      run: bashate --ignore E006 {staged_files}

# Not git hooks. lefthook has no equivalent of pre-commit's manual stage, so the
# checks that are too slow or too host-dependent to sit in front of a commit are
# named groups instead: `lefthook run preflight`, `lefthook run coverage` and
# `lefthook run uphold-manual`. Same entry points as the manual hooks in
# .pre-commit-config.yaml, so the three runners are still answering one question
# each.
preflight:
  commands:
    deps-check:
      run: scripts/deps.sh check

coverage:
  commands:
    coverage:
      run: scripts/coverage.sh

# The guards that ask a network the same question once per distinct name or pin:
# too slow for a commit, and too important to leave to whoever pushes next. This
# group is what a scheduled run invokes, and it is the seam the retired
# `hook-pins-resolve` script used to hold at pre-commit's manual stage -- named
# `uphold-manual` because that is what hooks/lefthook.yml publishes to consumers,
# and a repository that runs itself under a different name is documenting a
# workflow nobody else has.
uphold-manual:
  commands:
    guards:
      run: cargo run --quiet -- guard --stage manual

commit-msg:
  commands:
    guards:
      run: cargo run --quiet -- guard --stage commit-msg --message {1}

pre-merge-commit:
  commands:
    guards:
      run: cargo run --quiet -- guard --stage pre-merge-commit

pre-push:
  commands:
    # The pin check is not a command of its own any more. It was
    # `hook-pins-resolve`, a Python script asking whether every `rev:` still
    # named a ref that exists, beside a `no-stale-hook-pins` guard asking
    # whether the pin had fallen behind -- two checkers over one answer, free to
    # disagree, and they did: the guard counted a pin it could not reach as
    # passed. One `git ls-remote` answers both questions now, inside the guard
    # the `guards` command below runs, and a pin it could not check is exit 2.
    #
    # `use_stdin: true`, which this was missing. lefthook runs a command under a
    # pseudo-TTY by default and that stdin never closes, so git's ref lines
    # never arrived and the guards that read the pushed range were asked about
    # a push they could not see. They now refuse rather than fall through to
    # the working tree, so the omission is a failed push instead of a green
    # tick over the wrong tree -- but it is still an omission, and this repo
    # had it in the file it publishes as the example.
    guards:
      use_stdin: true
      run: cargo run --quiet -- guard --stage pre-push --remote {1} --remote-url {2}
