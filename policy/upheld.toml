# What enforces which principle in this repository.
#
# One entry per rule that already fires. Each is checked against this repo's own
# configuration, so a claim goes stale loudly when the rule is removed or
# disabled -- which is the only failure mode a declaration file has.
#
# A rule id resolves against every seam at once, and a rule enforced at more
# than one seam is reported at each: `prevent-ai-author` guards a commit
# message and a pull-request body, and the claim covers both.
#
# Principles this repository takes seriously but does not yet enforce are not
# listed here. They live in prose, where a reader can weigh them, rather than in
# a config file that would have no condition on which to raise them.

[[enforce]]
principle = "explicit-unknown"
rule = "catalog-tests"
# tests/test_uphold_check.py asserts that an unreadable declaration exits 2
# and not 0.

[[enforce]]
principle = "single-authoritative-source"
rule = "catalog-reference-current"
# QUICK_REFERENCE.md and name-index.json are generated; the hook refuses a tree
# where either has drifted from the records it was built from.

[[enforce]]
principle = "make-illegal-states-unrepresentable"
rule = "catalog-validate"
# A record with an unknown kind, status, enforcement level or rung, a field the
# schema does not name, a relationship to an id that does not exist, or a
# conflict only one of its two records lists cannot be committed.

[[enforce]]
principle = "single-authoritative-source"
rule = "catalog-tests"
# The MSRV is one number cargo and the host preflight both need, in two manifest
# formats neither tool can read across. tests/test_toolchain.py refuses a tree
# where Cargo.toml's `rust-version` and toolchain.toml's rustc `want` have
# drifted -- which is the only failure a copy has once it is allowed to exist.

[[enforce]]
principle = "explicit-unknown"
rule = "no-stale-hook-pins"
# A pin that could not be checked -- a remote this run could not reach, a
# directory it could not read, or a tree holding no hook configuration of either
# manager at all -- exits 2, which is not the 0 it would exit if the pin
# resolved. That third case is the could-not-look one step earlier than the
# others: zero pins found is not zero pins to find, and a config renamed, moved
# above the root, or added to .gitignore looks exactly like a repository that
# never had one.
#
# A bare sha naming no tag is deliberately NOT one of them, and must not be
# listed here as though it were: the sha arm of `src/pins.rs::stale` passes it,
# on the ground that a sha is neither behind a tag nor missing. This claim
# records that decision rather than papering over it -- what would make the
# claim false is the guard exiting 0 over a pin it could not establish, not over
# one it established by a different route.
#
# The claim used to name `hook-pins-resolve`, a separate script asking that half
# of the question while this guard asked the other and counted a pin it could
# not reach as passed; one rule asks both now, so the claim moves to the rule
# that carries it. src/pins.rs::stale returns the "Could not look is not a pass"
# refusal, and tests/hook_pins_cli.rs asserts that an unreachable remote is exit
# 2 rather than the exit 0 it used to be.

[[enforce]]
principle = "single-authoritative-source"
rule = "no-stale-hook-pins"
# The upstream tag owns the version; a lefthook `ref:` here is a copy of it. The
# hook refuses a copy that has drifted behind its owner, which is the only
# failure a copy has once it exists. A pre-commit `rev:` is the same copy, and
# `prek-pins-current` in .pre-commit-config.yaml is what refuses its drift.

[[enforce]]
principle = "complete-mediation"
rule = "prevent-ai-author"
# The commit-msg hook cannot see a pull-request body. This covers the path that
# reaches a public API without passing one.

[[enforce]]
principle = "fail-safe-defaults"
rule = "prevent-public-push"
# Push destinations are permitted by name, or by the forge saying the operator
# owns them; anything neither answers for is refused, and a forge that could
# not be asked is exit 2 rather than a pass.

[[enforce]]
principle = "observability"
rule = "removed-function-named"
# A removal is a state transition the tree keeps no evidence of: the function
# is in no file after the commit, and the message is the one record that can
# say it went and why. The guard refuses the commit until the message names
# it, which is the record's claim -- evidence sufficient to explain a decision
# without reproducing it -- applied to the history rather than to a running
# system. What would make this claim false is the guard exiting 0 over a
# removal it did not name: src/policy/removed_function_named.rs refuses one,
# and exits 2 rather than 0 when the parser could not read the file and the
# diff found no removal to refuse on.

[[enforce]]
principle = "least-privilege"
rule = "workflow-declares-permissions"
# A workflow with no `permissions:` block runs on the repository's default
# grant rather than on what the job needs. The rule refuses the workflow, not
# the setting -- the setting is one place and the workflows are many, and the
# one that gets edited is the workflow.

[[enforce]]
principle = "minimize-attack-surface"
rule = "workflow-declares-permissions"
# The token a workflow runs with is surface, and a default grant is surface
# nobody reviewed because it is in no file. The rule makes the grant a line in
# the workflow, where it can be read and compared across versions. What would
# make this claim false is the rule passing a workflow whose only
# `permissions:` is under a job: that one leaves the workflow's own grant at the
# default, and the pattern is anchored to column zero so it does not pass it.

[[enforce]]
principle = "compromise-recording"
rule = "no-local-merge"
# A merge made through a pull request leaves a diff somebody reviewed and a
# record of who approved it; one made on a workstation leaves a commit that
# looks the same and neither record. The forge's history is the record, and it
# is complete only while every merge reaches it through review. What would make
# this claim false is a local merge the guard exits 0 over at the moment git
# records it, which is the last moment the two are distinguishable.

[[enforce]]
principle = "compromise-recording"
rule = "no-merge-commit"
# The same act by the other road: a commit finishing a merge, or a squash merge
# resolved by hand, never passes `pre-merge-commit`. Two stages because there
# are two ways in; a claim on one of them would leave the other outside the
# record.

[[enforce]]
principle = "data-minimization"
rule = "no-private-repo-names"
# A commit message is published with the push and cannot be withdrawn once it
# is on a public remote. The guard refuses a message naming a repository that
# the forge or the private-owner list says is private, so what the history holds
# is no more than the change needs. What would make this claim false is a
# message naming a known private repository and the guard exiting 0; the rule
# stands down where `visibility` is `private`, and this repository declares
# `public`. A name the forge answers 404 for is printed rather than refused,
# and that is the limit the record states: a text rule matches the identifiers
# it has been told about.

[[enforce]]
principle = "data-minimization"
rule = "no-running-os-identity-metadata"
# The username, home path, hostname and default route of the machine running
# the scan are read at scan time and searched for in the tracked files, so an
# identity nobody listed is still found. What would make this claim false is a
# tracked file carrying the running host's identity and the scan exiting 0; an
# identifier of some other machine is not what this rule reads, and the claim
# does not cover it.

[[enforce]]
principle = "chestertons-fence"
rule = "removed-function-named"
# A function in no file after a commit is a fence taken down, and the message
# is the one place a reader who meets the old failure again can find why. The
# guard refuses the commit until the message names what went, which makes the
# removal a decision somebody wrote down rather than an accident of a cleanup.
# What would make this claim false is the guard exiting 0 over a removal the
# message does not name. It does not judge whether the stated reason is true,
# and a condition deleted inside a function that stays has no name to require;
# the record's limits say both.

[[enforce]]
principle = "deprecation-discipline"
rule = "no-stale-hook-pins"
# A hook pin behind its owner's newest tag is compatibility debt nobody has
# paid, and it grows into a jump across several releases. The guard refuses
# the pin, naming it and the tag it is behind, so the gap is closed while it is
# one release wide rather than found at the next forced upgrade. What would make this claim false is the guard
# exiting 0 over a lefthook `ref:` that is behind its newest tag, or over one it
# could not check. It reads hook pins only; a dependency lock is not what this
# rule measures.

[[enforce]]
principle = "reproducible-derived-state"
rule = "catalog-reference-current"
# QUICK_REFERENCE.md and name-index.json are a pure function of principles/,
# and the hook regenerates both and refuses the tree when the bytes differ. A
# derived file is then never read in place of its source without having been
# compared to it. What would make this claim false is the hook exiting 0 over a
# generated file that has drifted from what the catalog regenerates.

[[enforce]]
principle = "reproducible-derived-state"
rule = "review-current"
# REVIEW.md, AGENTS.md and review-controls.json are the same kind of copy, one
# compile further from the records, and the same comparison holds them. What
# would make this claim false is `--review --check` exiting 0 over a compiled
# document that differs from what --emit would write now.

# What routes to a rule, and what routes to a reviewer.
#
# `enforcement.automatable = "yes"` says a machine CAN decide the principle. It
# is a property of the principle, not of this repository -- so an unclaimed one
# is an error, and the entries below are the case that error cannot express on
# its own. Two have no subject here: this repository is a catalog and a CLI, and
# neither a queue nor a retryable side-effecting endpoint exists in it to carry
# the rule. The third has a subject and no gate: the module graph exists, and
# nothing here that runs can see a cycle in it.
#
# Recorded here with a reason rather than by amending the records. Changing
# `backpressure` to `partially` would make the catalog describe THIS repository
# instead of the principle, and the next consumer would read it and believe it.
#
# An entry goes stale the moment a rule does claim the record, and is reported
# then -- an exemption that no longer describes the tree is the check switched
# off for that record, and it would stay off.
[review]
max_lines = 900
# Two names for one compiled document, and neither is a second source: both are
# generated from the catalog under the same `--check` gate, so a stale one
# cannot be committed. AGENTS.md is where an agent looks; REVIEW.md is where a
# person does.
emit = ["REVIEW.md", "AGENTS.md"]
# Where the controls below are written for a harness to read. `--review --drive`
# plants them itself against a reviewer command the caller names; the model, the
# budget and the verdict stay with that command and out of this repository. The
# file is generated under the same `--check` gate as the document, so a control
# added here and never exported is refused.
emit_controls = ["review-controls.json"]

[review.no_subject_here]
backpressure = "Nothing here has a queue, an admission decision, or a producer to slow down. The record's checks are about a running service; this repository is a catalog and a command-line tool."
idempotency = "Nothing here has a retryable side-effecting endpoint. `uphold` commands read and report; the one that writes, --review --emit, is idempotent by construction because it writes a pure function of the catalog."
acyclic-dependencies = "No gate here decides a module graph. uphold is one crate, cargo refuses a cycle only between crates, so its modules may import each other freely, and no import-graph check runs over scripts/. A consumer claims the record for the gate that sees its units: an architecture linter in its hook configuration, or the build itself where the compiler refuses import cycles, as Go's does between packages."

# A record with no findings against it is either guarding a clean tree or saying
# nothing a reviewer can act on, and no count of citations tells those apart. A
# control is the change that does: plant it, and a reviewer who does not name
# the record has shown the record cannot fire. Same argument as `uphold probe`,
# one tier up, and the fixtures are written down here for the same reason --
# whoever wrote the record is the only reader who knows what violating it looks
# like, and a fixture in a file is reviewable.
#
# Every review-carried record carries one, and a test holds it there: a record
# added without a control is named on every run, as the line that says nothing
# here shows it can produce a finding. `--review --drive -- REVIEWER` plants
# each one and reports whether it holds.
#
# A `misses` is chosen to sit next to its `catches`: the same feature or
# decision, often the same file, a change that touches what the record is about
# without violating it. A reviewer that names the record on both is matching
# words, not the claim.
[[review.control]]
record = "complete-mediation"
catches = "Make src/shim/destination.rs stop asking whether a `gh issue create --repo other-owner/their-repo` destination is owned, leaving the ownership decision only in the pre-push path through prevent_public_push in src/guard/push.rs."
misses = "Reword the phrase src/guard/push.rs prints for the command seam from \"this command would publish to\" to \"this command would send text to\", leaving the decision it reaches unchanged."

[[review.control]]
record = "confused-deputy"
catches = "Make the gh shim in src/shim/destination.rs, when a command's --repo names a repository the workspace does not own, retry the command with the shim's own configured App token, so any repository that token can reach is accepted whoever typed the command."
misses = "Make the refusal src/guard/push.rs prints after a failed forge lookup name the forge client it asked, still refusing the same destinations."

[[review.control]]
record = "conways-law"
catches = "Move principles/ and scripts/validate.py into a separate repository run by the people who write records, and have the Rust crate fetch it at a pinned revision, on the ground that record authors and engine maintainers rarely talk, although nearly every record-field change also edits src/catalog.rs and the schema in the same pull request."
misses = "Add a CODEOWNERS entry that names the people who write records as reviewers for principles/, leaving the directory and the build in this repository."

[[review.control]]
record = "current-stack"
catches = "Pin rust-toolchain.toml `channel` to a release line the Rust project no longer supports, with the comment \"kept because every contributor already has it installed\" as the only reason, so the toolchain is retained for being there and not for any support it has today."
misses = "Raise rust-toolchain.toml `channel` from `stable` to an explicit current release number, with a comment saying the number is the supported line on the date the pin was written."

[[review.control]]
record = "defense-in-depth"
catches = "Delete the \"The policy over its own tree\" step from the scan engine job in .github/workflows/test.yml because the uphold-scan command in hooks/lefthook.yml already runs `uphold scan` on every commit, so a commit made with --no-verify is no longer scanned anywhere."
misses = "Move the \"The policy over its own tree\" step in .github/workflows/test.yml ahead of `cargo test --locked` so a policy failure is reported first, keeping both steps."

[[review.control]]
record = "economy-of-mechanism"
catches = "Let prevent_public_push in src/guard/push.rs accept allow-list entries written as regular expressions, per-rule fallback commands and an \"ask the forge, else a script\" chain, all decided inside the one function that refuses a push."
misses = "Add unit tests to src/guard/push.rs showing that a destination under an owner nothing declares is refused and that one under a declared owner written in a different case is accepted, changing no code outside the test module."

[[review.control]]
record = "end-to-end-principle"
catches = "Change scripts/install_lefthook.sh to drop its sha256sum comparison of the archive against the release's checksum file and rely on curl's TLS and its exit status instead, so the archive is checked only on the network hop and never against the digest computed where it was built."
misses = "Make scripts/install_lefthook.sh print the asset name and the checksum line it matched before running `sha256sum --check --strict`, which still fails the install on a mismatch."

[[review.control]]
record = "enforcement-needs-a-trigger"
catches = "Add a rule to policy/upheld.toml whose only payload is a paragraph of design advice about naming, with no files, pattern or stage to match, so it is printed on every commit as if it were a check that had passed."
misses = "Make the message over_budget in scripts/review.py returns also say how many lines the document is over the ceiling, still returning it when the document is too long."

[[review.control]]
record = "fail-fast"
catches = "Change uphold_check.py's read_toml() so a policy/upheld.toml that tomllib cannot parse is treated as an empty declaration, and `--review --check` goes on to print \"compiled review is current\" and exit 0 instead of exiting 2 with the parse error."
misses = "Change the message uphold_check.py prints when policy/upheld.toml cannot be parsed so it carries the line and column tomllib reported, still exiting 2."

[[review.control]]
record = "follow-published-standards"
catches = "Change src/junit.rs so the suite timestamp is written in a format of its own, day/month/year and local clock time with no zone, instead of the RFC 3339 form the report was read with, which the test-report consumers parse."
misses = "Add a unit test to src/junit.rs that parses the suite timestamp attribute back as RFC 3339 and asserts it is present."

[[review.control]]
record = "goodharts-law"
catches = "Change scripts/coverage.sh to leave src/shim.rs and src/config.rs out of the measured files, so the reported percentage clears the floor the hook and CI enforce, without adding a test."
misses = "Make scripts/coverage.sh print the per-file line percentages beneath the total in its terminal summary, still failing only under the floor it already enforces."

[[review.control]]
record = "graceful-degradation"
catches = "Change uphold_check.py's engine_report() so that when `uphold check --json` reports unavailable evidence it returns an empty report instead of raising, and `--review --check` goes on to print \"compiled review is current\" and exit 0."
misses = "Change the message engine_report() raises for unavailable evidence in uphold_check.py so it lists each unavailable item on its own line."

[[review.control]]
record = "high-cohesion-low-coupling"
catches = "Move the OSCAL export from uphold_check.py into scripts/review.py beside render() and drive(), and have it call uphold_check's engine() subprocess wrapper and index the dictionaries reconciliation_report() builds, so a change to the engine's JSON needs edits in both files."
misses = "Split scripts/review.py's render_drive() into two functions in the same file, one that formats a record's row and one that formats the summary line."

[[review.control]]
record = "host-owned-logs"
catches = "Change src/junit.rs so that when neither --junit nor UPHOLD_JUNIT is given, every guard run still writes its JUnit document into a directory uphold creates under $XDG_STATE_HOME/uphold/runs/, keeping the newest 100 files and deleting older ones itself."
misses = "Add a unit test to src/junit.rs asserting that a guard run given neither --junit nor UPHOLD_JUNIT writes no file."

[[review.control]]
record = "hyrums-law"
catches = "Change scripts/review.py's render() so each section of REVIEW.md is headed by the record id instead of its title and the sections are ordered by domain instead of alphabetically, with no note beyond the commit message."
misses = "Rename the private helper _sorted_records in scripts/review.py to _ordered_records and update its callers, leaving the compiled document byte-for-byte unchanged."

[[review.control]]
record = "information-hiding"
catches = "Make uphold_check.py's run_review() print the drive results by indexing the dictionaries scripts/review.py's drive() returns (result[\"caught\"], result[\"fired\"]) and recomputing pass or fail itself, instead of calling review.holds() and review.render_drive()."
misses = "Change scripts/review.py's render_drive() to print \"misses: none written\" in place of \"misses not written\" for a control that declares no misses."

[[review.control]]
record = "informed-consent"
catches = "Make `uphold --install` in src/install.rs also append the PATH hook line to the user's shell startup file (~/.bashrc, ~/.zshrc or fish's config.fish), without printing it and without a flag to skip it, along with linking the commands."
misses = "Make `uphold --install` in src/install.rs print the path each new link points at beside \"linked\", in the line it already prints for every name."

[[review.control]]
record = "least-astonishment"
catches = "Make `uphold_check.py --review --check` rewrite REVIEW.md and AGENTS.md in place when they are stale and exit 0, printing nothing about the write, so someone who ran a command named check to look at the tree finds their working copy changed afterwards."
misses = "Make `uphold_check.py --review --emit` print the absolute path of each file it writes, beside the name and line count it already prints."

[[review.control]]
record = "least-common-mechanism"
catches = "Change src/remote_policy.rs Repository::new() to use one fixed directory name under the system temp directory, kept between runs and reused as the scratch object store for every repository's policy fetch, instead of a fresh exclusive 0o700 directory removed on drop."
misses = "Change src/remote_policy.rs Repository::new() to put the counter before the process id in the scratch directory name, still created exclusively with mode 0o700 and removed on drop."

[[review.control]]
record = "least-power"
catches = "Let a [[waive]] entry in policy/hooks.toml carry a `when` string that `uphold hooks --identity` runs through sh -c to decide whether the waiver applies, beside the closed `findings` and `repos` lists it matches today."
misses = "Let `findings` in a [[waive]] entry of policy/hooks.toml accept one more fixed word, checked against the closed list the loader already holds, so an unknown word is still refused at load."

[[review.control]]
record = "make-illegal-states-unrepresentable"
catches = "Change the loader for policy/hooks.toml in src/hooks.rs to keep each waiver's `findings` as plain strings and compare them to Finding only when reporting, so a misspelled word loads and silently waives nothing instead of being refused when the file is read."
misses = "Change the load error src/hooks.rs raises for a [[waive]] entry with an empty `reason` so it also names that entry's id, still refusing at load."

[[review.control]]
record = "mechanism-policy-separation"
catches = "Hard-code the owner names a push may go to inside prevent_public_push in src/guard/push.rs and delete the policy/principles.toml setting a repository declares them in, so every repository running the guard gets the same owners and changing that rule means editing the Rust and cutting a release."
misses = "Change the refusal text prevent_public_push in src/guard/push.rs prints so it names the owner from policy that the destination was compared with."

[[review.control]]
record = "namespaced-identifiers"
catches = "Change src/junit.rs so each suite's package attribute, which an Allure reader files suites by, is the bare stage name such as pre-push or commit-msg instead of \"uphold\", so a report that collects several tools' suites files uphold's under names another tool's suites may also use."
misses = "Add a unit test to src/junit.rs asserting that every suite it writes carries package=\"uphold\"."

[[review.control]]
record = "observability"
catches = "Change the refusal path in src/main.rs so a refused guard prints only \"guard refused\" and exits non-zero, no longer printing the rule that refused (guard::refused_by), the input it judged, or the report body that says why, so an operator cannot tell one refusal from another without reproducing it."
misses = "Change the refusal path in src/main.rs so the rule id is printed on a line of its own before the report body, which it still prints in full."

[[review.control]]
record = "parameterize-do-not-enumerate"
catches = "Add uphold_check.py functions emit_review_md() and emit_agents_md(), each calling emit_target with its file name written in, beside the emit_target(root, name) that already takes any name."
misses = "Add a third file name to the emit list in the [review] table of policy/upheld.toml so `--review --emit` writes it through the existing emit_target."

[[review.control]]
record = "psychological-acceptability"
catches = "Make the uphold-check command in lefthook.yml fail every commit while any finding exists anywhere in the tree, with the single message \"policy violation\" and no baseline, per-rule skip, or file and rule named, so a tree with one old finding cannot commit."
misses = "Change the uphold-check command in lefthook.yml to print the rule id and file:line of each finding in its failure message, still failing the commit on any finding."

[[review.control]]
record = "reuse-maintained-components"
catches = "Replace the serde_saphyr parse in src/pins.rs pre_commit_pins() with a loop over the config's lines that finds `repo:` and `rev:` by splitting each line on the first colon and trimming quotes, so the crate is no longer called there."
misses = "Make src/pins.rs pre_commit_pins() put the source file's path in the error it returns when an entry has no `rev:`, still reading the config through serde_saphyr."

[[review.control]]
record = "reversible-decisions"
catches = "Rename the `applies_when` field to `scope` in every principles/*.toml and in scripts/catalog.py and scripts/validate.py in one commit and one release, with no release that reads both names, so a consumer pinned to the catalog has no step to move across and no way back but to edit every record."
misses = "Add an optional `examples` field to scripts/validate.py's accepted keys for principles/*.toml, which no record has to set and which scripts/catalog.py and scripts/review.py ignore when absent."

[[review.control]]
record = "robustness-principle"
catches = "Change src/pins.rs version_key() so that a tag written by an upstream in a slightly different style, such as `1.2.3` without the leading v or `v1.2.3.post1`, whose order is unambiguous, is no longer ordered but makes the pin check stop with a fatal error, where it is accepted today."
misses = "Change src/pins.rs so the finding for a stale pin lists the newer tags in ascending order, still ordering them with version_key() as now."

[[review.control]]
record = "rule-of-three"
catches = "Replace the two similar readers pre_commit_pins() and lefthook_pins() in src/pins.rs with one generic `PinSource` trait, a registry and configurable field-name mappings, built for hook-config formats that nothing in the repository reads yet, although only these two copies exist."
misses = "Move the repeated block that turns a config entry into a Pin, now written in several places in src/pins.rs, into one helper function there, with no new trait or option."

[[review.control]]
record = "separation-of-concerns"
catches = "Make src/pins.rs version_key() call remote_refs() to fetch the tags itself and sort them, and have it print the stale-pin report text, so that ordering a tag, reaching the network and wording the finding are one function that cannot be tested without a remote."
misses = "Add unit tests in src/pins.rs for version_key() ordering of `v1.0.0-rc1`, `v1.0.0` and `v1.0.0-1`, leaving remote_refs() and the report wording where they are."

[[review.control]]
record = "separation-of-privilege"
catches = "Add a TAG_RELEASE_FORCE environment variable to scripts/tag-release.sh that, when set, skips the checks on the squash-merge subject, the parent's lower Cargo.toml version and the files changed, and goes on to tag and push with nothing recorded about its use."
misses = "Make scripts/tag-release.sh print, before its dry-run summary, each check it has passed and the version it read from origin/main's Cargo.toml, with the checks themselves unchanged."

[[review.control]]
record = "single-authoritative-source"
catches = "Add a hand-written docs/PRINCIPLES.md that restates each record's claim and applies_when, alongside the generated REVIEW.md that already compiles them from principles/*.toml."
misses = "Change scripts/review.py's render() so the compiled document prints applies_when before the claim."

[[review.control]]
record = "unix-composability"
catches = "Make `uphold_check.py --review --emit` ask \"Overwrite REVIEW.md? [y/N]\" through input() before writing, with no flag to answer it, so a script or agent without a terminal hangs or gets an end-of-file error and the exit status is 0 either way."
misses = "Make `uphold_check.py --review --emit` print a one-line summary of the files it wrote to stderr, leaving the files written and the exit status as they are."
