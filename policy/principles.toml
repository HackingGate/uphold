# Content policy for this repository.
#
# One `[rule.<id>]` section per rule: the id is the section header, and
# `files.*`, `git.*` and `command.*` live inside it as dotted keys. Nothing
# about a rule lives outside its header's scope, so a sub-table cannot drift
# away from its rule during an edit -- and a duplicate id is a TOML parse
# error rather than a runtime check.

# Default script constraint for every file no scoped rule selects. Values are
# Unicode script names, spelled as regex engines spell them: "Latin" is exactly
# what \p{Script=Latin} matches.
allowed_scripts = ["Latin"]

# Who this repository belongs to. One declaration for the whole policy, because
# identity is a property of the repository rather than of any rule in it -- and
# because a rule arriving from a bundled set cannot be handed a parameter, so a
# guard that needs to know reads it from here. `unowned-push` refuses to run
# without it, which is the point of that set.
owner = "HackingGate"

# Whether what this repository publishes is visible to everyone. Declared rather
# than looked up, for the same two reasons `owner` is: a lookup makes every
# commit wait on a forge, and the answer is a decision rather than a reading --
# and a rule arriving from `private-names` cannot be handed a parameter, so the
# policy is where it reads this from.
#
# It is a settled fact rather than a placeholder: this repository was published,
# so the guards that fire only on a public tree are in scope on every commit
# written here. It said `private` for a day after the flip, and that is how the
# finding below was written. This line is the WHOLE scope test -- a rule that
# believes its repository is private refuses nothing, silently, and reports a
# clean tree while doing it -- so a value left behind by a visibility change is
# not a stale comment, it is the guard switched off. Flipping a repository means
# editing this line in the same change, and the check to run before doing so is
# `uphold audit --for-publication`, which asks what a flip would republish under
# the visibility it is flipping TO. Every guard here asks "is the target public
# NOW", so nothing else re-examines a name that was correctly allowed at write
# time.
#
# What the flip published, and what no rewrite reaches: commit 188970b2, on the
# retained head ref of the pull request that merged it, names a private
# organisation in its message. The squashed commit on the default branch does
# not. The remaining copy is the forge's to remove, not a rewrite's.
visibility = "public"

# Where the private-owner list comes from. Declared, not looked up: a forge
# lookup answers for `owner/repo`, and these are organisations -- the form that
# got past a hand audit of this repository was an organisation named on its own,
# in a sentence about what it carries. A declaration is also the only thing that
# can answer for an owner whose existence is itself the thing not to disclose.
#
# Read from OUTSIDE the repository, which is the whole point: a list of names
# that must not be published cannot live in a file that is about to be
# published, and neither can a command string with a name written into it. The
# policy stays committed and reviewable; the names do not travel with it.
private_owners_from = "cat ${XDG_CONFIG_HOME:-$HOME/.config}/principles/private-owners"

# ...and the line that makes the line above safe to commit in a repository other
# people clone. This is measured rather than assumed:
#
#   form in the text                        with the source   without it
#   https://github.com/<owner>/<repo>       refused           refused
#   <this repository's owner>/<repo>        refused           refused
#   <other owner>/<repo>, bare              refused           NOT SEEN
#   an organisation named on its own        refused           NOT SEEN
#
# The bottom two need a DECLARED owner: a bare `owner/repo` is otherwise
# indistinguishable from a relative path, so it is extracted only for declared
# owners and for this repository's own. Everything else reaches the forge on its
# own and is judged there.
#
# So the source is worth having, and the file it reads is one operator's and
# will not exist in a clone. Without this line a missing source is exit 2 --
# every clone refused on its first commit, over a worked example that runs
# nowhere but the author's laptop. With a command that swallowed its own failure
# it would be exit 0 and the bottom two rows would be lost in silence, in every
# clone, permanently. This is the third answer: the failure is REPORTED, on
# stderr, naming those two rows, and the commit proceeds.
private_owners_optional = true

[inherit]
# The shared process-residue set -- conflict markers, home paths, dated and
# status metadata, tracker and thread references, private data paths --
# compiled into the binary rather than fetched from a pinned checkout of
# another repository. `uphold rules --set process-residue` prints its
# rules.
sets = [
    "process-residue",
    "host-identity",
    "broken-links",
    "doc-claims",
    # Not residue in what is committed but how CI is configured, which is why it
    # is a name of its own. Promoted out of this file: the declaration that
    # stood here was byte-identical to nine others across the fleet, which is
    # the whole argument for a set.
    "default-token-grant",
    # The guard sets. Each installs git hooks, and each is named separately
    # because taking one is a separate decision -- `stale-pins` reaches the
    # network, `invisible-characters` reads the whole tree at four stages, and
    # `unowned-push` refuses to guess who this repository is.
    "commit-message-residue",
    "unreviewed-history",
    "invisible-characters",
    "stale-pins",
    "unowned-push",
    # The three private-name guards, at the three seams that publish text and
    # have a git hook in their path. It refuses to run until `visibility` above
    # says whether this tree is published, which is the same shape
    # `unowned-push` uses for `owner`. The fourth seam -- `gh` and `git push`,
    # where text reaches a forge API with no hook at all -- is the `[[shim]]`
    # further down, because no set may put a program in front of a real command.
    "private-names",
    # The checkers for that fourth seam. The set supplies checkers and never
    # shims, so the `[[shim]]` tables further down stay this repository's own
    # declaration -- and two of its three rules are shadowed below, because
    # this repository stands in front of `glab` and `npm` as well and a rule
    # arriving from a set cannot be handed a wider command list.
    "published-text",
]

# The engine's own tests write Japanese, because the two rules they exercise --
# which scripts a path may use, and which variation selectors are earned -- can
# only be tested by carrying the script they are about. Named paths rather than
# a global grant, which would admit Japanese everywhere and switch off the very
# check the fixtures exist to test. Latin is in the list because this list is
# the WHOLE truth for these paths -- it replaces the top-level declaration
# rather than adding to it.
[rule.engine-test-fixtures]
allowed_scripts = ["Latin", "Han", "Hiragana", "Katakana"]
files.include = ["tests", "src/guard/unicode.rs"]

# `workflow-declares-permissions` used to stand here, as the one instance of the
# `require_regexp` kind anywhere -- a rule kind with no instance is
# indistinguishable from a rule kind that does not work. It is in
# `default-token-grant` now, inherited above, and the kind is still exercised
# because a bundled rule runs here exactly as a local one did. What promoted it
# was not this repository: nine siblings had written the same rule out, word for
# word, each without knowing the others had.

# A tracked doc states what holds; the story of how it came to hold lives in
# git history and the tracker. Prose that says a name became another name goes
# stale the day either name moves again, and nothing marks it stale.
#
# Only the cheap, high-precision slice is mechanized. Words deliberately NOT in
# the pattern, each kept out by a present-tense use in REFERENCE.md today:
# `replaces` (a scoped list replaces the top-level declaration -- semantics,
# not history), `no longer` (a baselined path the rule no longer selects),
# `becomes` (ordinary spec prose). Arrow tables and history phrased in the
# present tense are not decidable at acceptable false-positive cost; that
# remainder stays with the review tier.
#
# No document is carved out. There was one -- the page that mapped old
# spellings to new -- and it went when the migration path did: nothing here
# reads an old spelling, so no page has to explain one. The calibration lives
# as a test beside the engine's pattern tests, which carries a matching fixture
# and the excluded words.
[rule.no-before-after-narrative]
message = """
State what holds, not what it replaced. A tracked doc that says a name became
another name goes stale the day either name moves again, and the story of the
change belongs in git history and the tracker rather than in the page.
"""
regexp = '(?i)\b(?:became|was renamed|renamed to|formerly|previously (?:called|named|spelled)|used to be)\b'
files.glob = ["*.md"]
files.exclude = ["CHANGELOG*", "**/tests/**", "**/test/**"]

# The same sentence, in the files the *.md rule was never able to reach.
#
# A `regexp` over source finds the phrase in a string literal as readily as in a
# comment, and this repository has both -- the message a rule prints is a string
# containing the prose the rule is about. So the subject is the comment, read off
# the parse, and `///` is excluded because a doc comment is published output
# rather than a remark to the next reader.
#
# The pattern is not the *.md one. `used to be` is shared, and `no longer
# needed` and `previously, this` are added because those are the tenses a
# comment reaches for when it explains the diff to whoever arrives next.
#
# `was renamed`, `renamed to` and `formerly` are deliberately NOT here, though
# the *.md rule carries all three. Each was measured against this tree and each
# fired on domain prose rather than on history: `guard/names.rs` is about
# repositories that get renamed, and `selection.rs:309` about a root renamed
# away underneath a walk. A document does not talk about renaming; the code that
# handles it does nothing else.
[rule.no-before-after-narrative-in-source]
message = """
State what holds, not what it replaced. A comment that explains what the code
used to do goes stale the day either version moves again, and the story of the
change belongs in the commit that made it.
"""
comment_regexp = '(?i)\b(?:used to be|used to (?:use|call|return|do|have|rely)|previously[,:]?\s+(?:this|we|it|the)|no longer (?:needed|used|required|necessary))\b'
files.include = ["src", "scripts", "uphold_check.py"]
files.glob = ["*.rs", "*.py"]
files.exclude = ["**/tests/**", "**/test/**"]
# Three named roots and two globs, which is five ways for this rule to stop
# covering anything without one line of it changing. A comment rule that selects
# no files reports the same green as one that read the whole crate, so the claim
# that it still covers something is written where the run can check it.
files.min_selected = 1

# A comment carrying no word its own code does not already name.
#
# The test is a subset and not a list of boring verbs: every word the comment
# contributes has to be a word the statements under it already say, counting
# their string literals. `// Stop and disable dnsmasq` over `systemd::stop(...)`
# and `systemd::disable(...)` is trivial because all three words are in the code;
# the same comment with a reason attached is not, and no list had to be edited
# to know that.
#
# Tests are excluded because a test's comment names the case rather than the
# code -- `// Delete the applied local IPv6` above an assertion is what tells a
# reader which of nine assertions this one is.
[rule.no-trivial-comment]
message = """
This comment says only what the code beneath it already says. Delete it, or
replace it with the reason the code is that way -- a comment that repeats an
identifier goes stale the moment the identifier changes and helps nobody until
it does.
"""
trivial_comments = true
files.include = ["src", "scripts", "uphold_check.py"]
files.glob = ["*.rs", "*.py"]
files.exclude = ["**/tests/**", "**/test/**"]
# The same selection as the rule above, and the same floor for the same reason.
files.min_selected = 1

# A hook's display name is the one line it prints while it runs, and it is read
# by somebody who is not reading the file it came from. `uphold guard
# (pre-commit)` meant the stage, and under prek the terminal said
#
#   uphold guard (pre-commit)....................................Passed
#
# which an operator read as pre-commit -- the runner of that name -- having run
# this repository's guard. The question came back as "so pre-commit is running
# uphold?", which is the measurement: a parenthetical carrying nothing but a
# stage word is attached to the name of a program, and the reader binds it to
# the only other name on the line. Every runner this file is published to
# collides the same way, because the stage vocabulary and the runner vocabulary
# share their words: `pre-commit` is both, and `merge`, `push` and `manual` are
# plain enough English to be read as whoever is doing the running.
#
# So the parenthetical says which half it is, and says it with the githooks(5)
# spelling rather than a shortened one -- `(stage: pre-merge-commit)`, not
# `(merge)`. The short forms are what made the line ambiguous in the first
# place, and the long ones are what `git.hooks` and `--stage` already take, so a
# name and the argument it describes can be compared without translating either.
#
# The colon costs a pair of quotes, and there is no way around it: `name:
# uphold guard (stage: pre-commit)` is a `: ` inside a plain scalar, which YAML
# refuses to parse -- `uphold check` reads this repository's own manifest and
# said so before either runner got the chance. So every name in this shape is
# quoted, and a name that is not is a file neither prek nor pre-commit can load
# rather than a hook that runs under the wrong label.
#
# The rule reads the display names of both files that carry them: the manifest
# this repository publishes to consumers and the config it runs on itself. A
# rule over the published half alone would be enforcement that never applies to
# the tree it lives in, and the next name is as likely to be written in one file
# as the other.
#
# `manual sweep` is in the alternation on weaker grounds than the rest: no
# runner is called that, so the line it makes is less ambiguous than a bare
# `manual`. It is there because it is what this repository's own config said --
# `guards (manual sweep)`, renamed by the change that wrote this rule -- and a
# ratchet that does not hold the exact state the fix removed lets that state
# back in under a spelling nobody listed. The alternation covers what this tree
# has actually carried, not only the words whose collision is sharpest.
[rule.hook-name-says-stage]
message = """
Write a stage parenthetical in a hook display name as (stage: <githooks name>)
-- a bare stage word reads as the name of the runner rather than the stage, and
the display name is the one line a hook prints while it runs.
"""
regexp = '^\s*name:.*\((?:pre-commit|pre-push|pre-merge-commit|commit-msg|commit message|merge|push|manual sweep|manual)\)'
files.glob = [".pre-commit-hooks.yaml", ".pre-commit-config.yaml"]
# Two globs naming two exact paths, which is two ways for this rule to select
# nothing if either file is renamed -- and a name rule that reads no names
# reports the same green as one that read every hook in the repository.
files.min_selected = 2

# ---------------------------------------------------------------------------
# Guards -- what git is about to do.
#
# A content rule reads the tree and could run at any moment. A guard reads an
# ACT: the message about to be recorded, the identity about to be stamped on it,
# the range about to be pushed. Same `[rule.<id>]` section and the same one id
# namespace, so a claim names a guard exactly as it names a content rule.
#
# There was no configuration file for these at all -- allow-lists, visibility
# pins and owner pins were environment variables, and the per-owner prefix
# scheme existed only because environment was the only surface while one machine
# holds several workspaces. A per-workspace file IS the workspace scope.
# ---------------------------------------------------------------------------

# Every guard this repository runs now arrives from a bundled set, named in the
# `[inherit]` block at the top of this file. The seven declarations that stood
# here were byte-identical to the sets' -- which is the whole argument the sets
# were promoted on, and a repository that ships them while transcribing them
# would be running the shape `no-hand-copied-base-rule` refuses.
#
# `owner` moved with `prevent-public-push`: it is at the top of this file now,
# because a rule arriving from a set cannot be handed a parameter, and who this
# repository belongs to was never a property of one rule anyway.

# The three private-name guards stood here, one `visibility = "public"` each --
# three copies of one fact, and a sweep found the same three declared in 10 of
# 77 repositories while 67 published text through no seam at all. They arrive
# from `private-names` now, and the fact they each carried is one line at the
# top of this file. What is left here is what belongs to THIS repository: the
# `[[shim]]` seam below, which no set may install, because a program standing in
# front of `gh` is not something to acquire by inheriting a name.

# ---------------------------------------------------------------------------
# Checkers -- what the shims consult.
#
# Both rules here SHADOW the `published-text` set inherited at the top of this
# file, same ids and same built-ins, because this repository stands in front
# of `glab` and `npm` as well and a rule arriving from a set cannot be handed
# a wider command list. The built-ins are this binary consulting itself
# in-process, which is the point twice over: the rule that judges a commit
# message and the rule that judges a pull-request body are the same rule, and
# the binary answering is the binary that asked rather than whatever `uphold`
# PATH happens to reach.
#
# The `exec` contract -- subject on stdin, kind in UPHOLD_KIND, 0/1/2 --
# remains for a checker written in anything else; nothing here needs it now.
# ---------------------------------------------------------------------------

[rule.no-published-host-identity]
message = """
Use neutral placeholders -- example-user, example-host, example.test,
/srv/example -- instead of values read off the machine you are standing on.
"""
builtin = "text-literals"
# Every command a shim collects a subject from. A hostname reaches a public
# place through a pull-request body, through a branch name in a push, and
# through a package's metadata, and none of those is more forgiving than the
# others.
#
# `npm` bare, not `npm publish`: the `[[shim]]` below matches `pack:*` as well,
# because the tarball's metadata is built by `pack` and merely uploaded by
# `publish` -- the same subject, one step earlier. A checker named for `publish`
# alone stands in front of only half of what the shim says it checks, and the
# shim now refuses an invocation it matches with no checker in front of it
# rather than passing it in silence, so `npm pack` was exit 2. Widening the
# checker keeps both subcommands checked; narrowing the shim would have bought
# the same green by looking at less.
command.before = ["gh", "glab", "git push", "npm"]
# `always`, overriding the tables' `public-target` and `public-registry`: host
# identity in text bound for a PRIVATE destination is still text on somebody
# else's infrastructure, with its own retention. The private-name rule keeps
# the tables' scope -- a private name bound for a private repository is the
# repository's own vocabulary, not a disclosure.
command.scope = "always"

[rule.no-published-markers]
message = """
A pull-request body reaches a public API without passing a single hook, which
is the whole reason this seam exists.
"""
builtin = "text-guards"
# Not `npm publish`: a package directory is not prose, and asking a guard that
# reads prose about one produces a pass over a subject it has nothing to say
# about. `git push` is here, and leaving it out was wrong. The three
# text-capable guards read an authorship trailer, an unusual character and a
# private organisation's name -- and a branch name is the second-likeliest place
# in this workspace for the third of those to land, after a commit message.
# `fix/acme-outage` goes onto a public forge in the ref list, in the pull
# request it suggests and in every notification, and pre-push is handed the refs
# but the guards that read them judge the DESTINATION and never the name. The
# other two guards passing over a branch name is not a wasted answer; it is the
# check, and `git push origin main:refs/heads/PrivateOrg-probe` walked straight
# through this seam while the field said otherwise.
command.before = ["gh", "glab", "git push"]
# `always`, for the reason the rule above gives.
command.scope = "always"

# The other question this seam has to answer, and the one it did not ask for
# most of its life. Both rules above judge the TEXT: is there a marker in it, is
# there a host name in it. Neither judges WHERE the text is going. So an
# invocation carrying blameless prose and `--repo other-owner/their-repo` passed
# every checker standing in front of `gh` and published, on a forge repository
# this workspace does not own -- which is what happened: an agent working in
# this tree opened text on somebody else's tracker, and nothing here was even
# asked. The text was fine. The destination was not ours, and no rule was
# looking at destinations.
#
# `prevent-public-push` had been answering exactly this question since the
# git-guards days -- for a push. A push is one road out of a workspace and a
# forge API is another, and the gate stood on one of them. This rule is the same
# gate on the other: `guard::push::unowned` is one predicate, and both seams
# reach it rather than each carrying a reading of "is this destination ours".
# A second copy worded for this seam would be two rules answering one question,
# and the day they disagree is the day one of them is the hole.
#
# `owner_required = true` for the reason the set that carries it gives: without
# it the only owner available is the one read off `origin`, and origin is the
# remote a destination guard exists to catch being wrong. This file declares
# `owner` at the top, so the pin is already there and this line is what stops it
# being quietly optional.
#
# `command.scope = "always"`, overriding the `gh` and `glab` tables'
# `public-target`, and the override is the whole point rather than a
# convenience. `public-target` asks a forge whether the destination is public
# and stands the rule down when the forge does not answer -- which is exactly
# the invocation that most needs asking about, since a lookup that fails is a
# lookup that told nobody anything. Worse, the question is the wrong one:
# whether a repository is YOURS is a fact about the destination, not about its
# visibility. A private repository belonging to somebody else is still not
# yours, and publishing into it is still publishing into somebody else's tree.
# So this rule is in scope on every invocation the shims collect, and it costs
# no round trip to be there -- the destination is read off `--repo` or off the
# remote, and no forge is asked.
#
# Not promoted to a bundled set here, deliberately. Every repository that
# inherits a set gets whatever the set carries on a version bump, and a rule
# that can refuse a `gh` invocation outright is not a thing to acquire by
# inheriting a name -- and it would drag `policy/base/sets.lock.json` and the
# base-set corpus along with it. Promotion is a separate decision, taken once
# this rule has been wrong here for a while and has not been.
[rule.unowned-forge-target]
builtin = "prevent-unowned-target"
owner_required = true
command.before = ["gh", "glab"]
command.scope = "always"

# ---------------------------------------------------------------------------
# Shims -- what a command is about to publish.
#
# The bash specs were mostly data already: SPEC_MATCH and the SPEC_*_FLAGS were
# space-separated lists. Only `spec_target` and `spec_in_scope` carried logic,
# and both became built-ins.
#
# Shims keep `[[shim]]`: their fields are flat, with no sub-tables to drift,
# so the ambiguity the rule sections existed to end never applied here.
# ---------------------------------------------------------------------------

# Subcommands are NAMED rather than pattern-matched. A shim that guesses which
# ones carry text is one release away from either missing a new one in silence
# or blocking one that never carried any, and only the first failure is visible.

# A release is titled by its tag. The release list is a version picker, and
# every entry in this repository's is its tag -- except the one that was not,
# published as a sentence while every neighbour read vX.Y.Z, and renamed by
# hand afterwards. The prose belongs in the notes; the format belongs to a
# rule, so the next inconsistent title is refused before it is published
# rather than renamed after.
[rule.release-title-is-the-tag]
message = """
Title a release by its tag -- vX.Y.Z, nothing appended. The release list is a
version picker; the prose belongs in the notes.
"""
require_regexp = '^v[0-9]+\.[0-9]+\.[0-9]+$'
subjects = ["title"]
command.before = ["gh release create", "gh release edit"]
# `always`: a format is a fact about the text, not about the destination, and
# the table's public-target would stand this rule down exactly where a lookup
# failed -- which is how the incident this rule exists for nearly repeated
# itself during its own test.
command.scope = "always"

[[shim]]
command = "gh"
match = [
  "pr:create", "pr:edit", "pr:comment", "pr:review",
  "issue:create", "issue:edit", "issue:comment",
  "release:create", "release:edit",
  "gist:create",
  # Five that carry text and stood behind nothing until 1.8.0. `pr:merge`
  # publishes the merge commit message through flags this table already names.
  # The four close/reopen verbs publish through `--comment`, which it cannot
  # name here -- see the `[[shim.verbs]]` below.
  "pr:merge",
  "issue:close", "pr:close", "issue:reopen", "pr:reopen",
]
text_flags = ["-b", "--body", "-n", "--notes", "-d", "--description"]
# A title is a subject of its own kind, so a format rule about titles is never
# asked about a body -- and a title given alone no longer reads as "the body
# was supplied", which used to close the editor checkpoint over the body the
# command was about to open an editor for.
title_flags = ["-t", "--title"]
file_flags = ["-F", "--body-file", "--notes-file"]
target_flags = ["-R", "--repo"]
# --fill takes the body from commit messages, which commit-msg already guarded
# on the way in. Checking it again would refuse text that is already published
# and cannot be edited, which teaches the wrong lesson about the guard.
skip_flags = ["--fill", "--fill-first", "--fill-verbose"]
web_flags = ["-w", "--web"]
editor_env = "GH_EDITOR"
target = "forge-repo"
scope = "public-target"

  # `-c` is not one flag. On `gh pr review` it is a BOOLEAN -- "Comment on a
  # pull request" -- and on `gh issue close` it TAKES A VALUE -- "Leave a
  # closing comment". Naming it above would make `gh pr review -c -b "body"`
  # read `-c` as consuming `-b`, so the body being published would go unread:
  # a false negative introduced into the seam that exists to prevent one.
  #
  # The list REPLACES the table's for these four verbs rather than adding to
  # it, which is why `--title` and `--body` are absent -- neither is a flag
  # these commands accept, and reading a flag a command will not take is this
  # shim claiming to have checked a subject that was never published.
  [[shim.verbs]]
  match = ["issue:close", "pr:close", "issue:reopen", "pr:reopen"]
  text_flags = ["-c", "--comment"]

[[shim]]
command = "glab"
match = ["mr:create", "mr:update", "mr:note", "issue:create", "issue:update", "issue:note"]
text_flags = ["-d", "--description", "-m", "--message"]
title_flags = ["-t", "--title"]
file_flags = ["--description-file"]
target_flags = ["-R", "--repo"]
editor_env = "GLAB_EDITOR"
target = "forge-repo"
scope = "public-target"

# The case that proves a shim is not just a flag table. git publishes text no
# git hook is in a position to read: a branch name goes onto a public forge in
# the ref list, in the pull request it suggests and in every notification, and
# pre-push is handed the refs but the guards that read them judge the
# DESTINATION and never the name. Its text is positional, so it needs its own
# collector rather than a fork of the shim.
[[shim]]
command = "git"
match = ["push:*"]
target = "git-remote"
scope = "public-target"
collect = "git-refs"

# And the case that proves `scope` is an enum. `npm publish` puts a directory
# on a registry the whole world can read: there is no repository, no owner and
# no visibility endpoint in that sentence. What decides is a field in
# package.json and whether the registry is the public one.
[[shim]]
command = "npm"
match = ["publish:*", "pack:*"]
target_flags = ["--registry"]
skip_flags = ["--dry-run"]
scope = "public-registry"
collect = "npm-package"

# The set this repository ships, taken by this repository, because a rule whose
# only consumer is somebody else is a rule nobody here has ever watched refuse.
#
# An override that NARROWS an inherited rule is the documented shape and stays
# silent; what gets reported at load is an override that changes the CHECK, so
# `builtin` is restated here exactly as the set ships it and only the selection
# moves.
#
# EVERY EXCLUSION IS A SYNTAX EXAMPLE, which is the first trap a repository hits
# on inheriting this set and the reason the set's own comment names it. A
# document that DEFINES the marker carries one, against a `source=` that was
# never meant to exist: `docs/REFERENCE.md` shows the grammar, the set file
# argues for it, and the checker and its tests carry fixtures. Excluded by path
# so the exemption is visible in the policy rather than buried in the checker,
# which is the shape every other rule here uses to say "not there".
#
# This is not a way of switching the rule off. No other file in this tree
# declares an anchor, so what stays selected is every document that could
# acquire one.
[rule.no-stale-anchored-fact]
builtin = "anchors-resolve"
message = """
A document states a fact that has moved. The anchor beside the sentence names
where the value lives, and the file it names now says something else -- or no
longer has the key, or is gone. Re-read the source and correct the sentence, or
drop the anchor if the sentence no longer needs the value inline.
"""
files.include = ["."]
files.exclude = [
    "docs/REFERENCE.md",
    "policy/base/doc-claims.toml",
    "src/anchors.rs",
    "tests/scan_cli.rs",
]
