# Base rule set: process-residue
#
# Authoring and process residue in committed content -- conflict markers, home
# paths, dated and status metadata, tracker and thread references, private
# data paths. Pull in from a repo policy with:
#
#   [inherit]
#   sets = ["process-residue"]
#
# Opt out of any single rule with `disabled_rules = ["<id>"]` in that same
# `[inherit]` table, or override one by redefining a rule with the same id in
# your own policy. Naming an id nothing inherited defines is refused, so a rule
# renamed upstream cannot leave a silent opt-out behind.
#
# Every rule defaults to `exclude = ["**/tests/**", "**/test/**"]` because test
# fixtures legitimately carry example-bad content. Patterns are generic shapes
# only — no project-, host-, or account-specific content.

#
# The test-path exclusions are a LAYOUT assumption, and it is Python's and
# JavaScript's. Go puts a test beside what it tests as `<name>_test.go`, and Rust
# puts unit tests inline; neither ever produces a `tests/` segment for them. So a
# Go repository got the stated rationale -- test fixtures legitimately carry
# example-bad content -- applied to none of its tests, and had to choose between a
# local override and a permanently red gate. One consumer chose red: its
# credential-redaction test, whose whole subject is a credential that must not
# leak, was refused by the rule against committed credentials.
#
# `**/*_test.go` extends the same allowance to the same kind of file. The cost is
# real and worth stating: a genuine credential pasted into a Go test now passes.
# That cost was already accepted for every file under `tests/`, and a gate nobody
# can keep green is a gate that gets ignored wholesale rather than per-rule.

# WHAT THIS SET MAY INSTALL. `stages` is the ceiling, and this is the one
# bundled set that carries anything at a hook: `no-hand-copied-base-rule`, at
# `manual`. `manual` is the whole of the permission on purpose -- nothing runs
# a manual stage on its own, so the rule is a report a reader asks for rather
# than a gate that arrives with a version bump. Any rule here declaring
# `pre-commit`, `commit-msg`, `pre-merge-commit` or `pre-push` is refused at
# load: a guard gets a new set named for what it refuses, and widening this
# line is the diff that says otherwise.
[set]
stages = ["manual"]

[rule.no-merge-conflict-markers]
message = """
Do not commit Git merge-conflict markers. Resolve the conflict and remove the
<<<<<<< / ======= / >>>>>>> lines before committing.
"""
# Match a full conflict block so a lone `=======` (RST/Markdown underline) does
# not false-positive. Needs multiline to span the block.
regexp = '^<{7} [\s\S]*?^={7}$[\s\S]*?^>{7} '
files.multiline = true
files.include = ["."]
files.exclude = ["**/tests/**", "**/test/**", "**/*_test.go"]

[rule.no-hardcoded-home-paths]
message = """
Do not commit hardcoded user home paths. Use neutral paths such as
/srv/example/... or discover runtime paths from configuration and system state.
"""
regexp = '(?:/home|/Users)/[A-Za-z0-9._-]+|[A-Za-z]:\\Users\\[A-Za-z0-9._-]+'
files.include = ["."]
files.exclude = ["**/tests/**", "**/test/**", "**/*_test.go", "policy/**", "README.md"]

[rule.no-dated-source-metadata]
message = """
Do not commit dated status metadata in source docs. Use Git history for
chronology and keep source files stable.
"""
# `Da[t]e` so this rule text never matches itself.
regexp = '^Da[t]e:[[:space:]]*[0-9]{4}-[0-9]{2}-[0-9]{2}'
files.include = ["."]
files.glob = ["*.md", "*.rst", "*.txt"]
files.exclude = ["**/tests/**", "**/test/**", "**/*_test.go", "CHANGELOG*"]

[rule.no-status-source-metadata]
message = """
Do not commit workflow-state metadata in source docs. Track decision state in
your tracker, not in tracked files. An architecture decision record is the
exception: its status is the record's own standing, and docs/adr/ is excluded.
"""
regexp = '^Sta[t]us:[[:space:]]*[[:alnum:]_-]+'
# docs/adr/ is excluded because an ADR is the one document whose Status is NOT
# workflow state copied out of a tracker. It is the record's own standing --
# whether the decision binds, was amended, or was superseded -- it is part of the
# ADR form itself, and it has no other home: an ADR outlives the tracker item that
# produced it, and a superseded ADR has to say so where it is read, not in an
# issue nobody opens. Without this, a reader cannot tell an accepted decision from
# an abandoned sketch, which is precisely the state this exclusion was found in.
#
# Two consumers had already worked around it with an identical local override,
# and a third was about to. A base rule that every consumer with ADRs must
# override is a base rule with the wrong scope.
files.include = ["."]
files.glob = ["*.md", "*.rst", "*.txt"]
files.exclude = ["**/tests/**", "**/test/**", "**/*_test.go", "**/docs/adr/**"]

[rule.no-task-tracker-references]
message = """
Do not commit task-tracker references in source docs. Keep task tracking in
tracker metadata, not in tracked files.
"""
regexp = 'github\.com/[^[:space:])]+/(?:issues|pull)/[0-9]+|(?:^|[[:space:]]|\(|\[)#[0-9]+\b'
files.include = ["."]
files.glob = ["*.md", "*.rst", "*.txt"]
files.exclude = ["**/tests/**", "**/test/**", "**/*_test.go", "CHANGELOG*"]

[rule.no-process-history-references]
message = """
Do not reference process-history records (issue/PR/thread numbers) in final
docs. Extract the durable rule or final state instead.
"""
regexp = '(?i)\b(?:issue|pr)\s+#[0-9]+\b|\bas discussed in (?:an? )?(?:issue|thread|pr)\b|(?:https?://)?github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/(?:issues|pull)/[0-9]+\b'
files.include = ["."]
files.glob = ["*.md", "*.rst", "*.txt"]
files.exclude = ["**/tests/**", "**/test/**", "**/*_test.go", "CHANGELOG*"]

[rule.no-tracked-private-data-paths]
message = """
Do not commit local private data, build artifacts, traces, or HAR captures.
Keep these under ignored local paths only.
"""
path_regexp = '^(?:data/private|artifacts|traces)(?:/|$)|\.(?:har|trace)$'
files.include = ["."]
files.exclude = ["**/tests/**", "**/test/**", "**/*_test.go"]

# The residue a PROCESS leaves in a policy file, which is the same category as
# the six rules above it: a rule copied out of a bundled set is the artefact of
# somebody having once had no other way to get it, kept long after the set
# existed. It reads the policy rather than the tree, which is why it is the one
# rule here with no `files` table.
#
# `manual` and nowhere else, for one release. Every other rule in this set fires
# where the residue is written; this one would fire on every commit in every
# repository that inherits the set -- 48 of them at the time it shipped -- over
# a shape none of them reviewed and some of them may have chosen. A report
# first, and a gate only once what it reports has been seen.
[rule.no-hand-copied-base-rule]
message = """
A rule a bundled set already ships is written out here by hand, from a set this
policy does not inherit. The bundled copy is re-read from the binary on every
run; a transcription is frozen at the moment it was typed, and nothing compares
the two.

Run `uphold guard --stage manual` to see which ids, which set owns them, and
what else that set would bring.
"""
builtin = "no-hand-copied-base-rule"
git.hooks = ["manual"]
