# Base rule set: comment-facts (what a comment may claim: not a measurement of
# the author's own data, which nothing can ever recount, and not the line
# beneath it, which the code already states)
#
# A comment that states a measurement is a fact with no anchor; a comment that
# restates the next line is a fact with no reader. Pull in with:
#
#   [inherit]
#   sets = ["comment-facts"]
#
# WHAT THE RULE IS ABOUT. A measurement of the author's OWN DATA: a size on
# disk, a count of repositories in a fleet, a duration timed on one machine, a
# cache size, a mutant count from one run. Such a number describes one tree,
# one machine or one day, and nothing in the code recounts it. It was taken
# once, by somebody, somewhere off the page.
#
# WHAT SLIPS THROUGH TODAY. `doc-claims` reads a document that carries a
# `fact-anchor`, and checks the value against the record the marker names. A
# comment carries no marker and names no record, so `no-stale-anchored-fact`
# never looks at it -- and `# <n> s timeout` beside a constant that says
# something else, or `// target/ alone is ~<n> MB` written when the directory
# was a third that size, is a sentence every reader believes and no check
# reads. The measurement was true once. Nothing fails on the day it stops
# being.
#
# THE EXAMPLES IN THIS FILE CARRY `<n>` WHERE A COMMENT WOULD CARRY DIGITS,
# and that is not squeamishness. This file is a `.toml` full of `#` lines, so
# the rules defined here read it exactly as they read any other source file. A
# set that had to exclude its own definition would be writing the first
# exemption into the rule it ships. The shape is what the examples are for,
# and `<n>` shows the shape; digits would be there only to make the file fire
# on itself. `process-residue` spells its own `Da[t]e` pattern the same way
# and for the same reason. The restatement rule reads this file the same way,
# and the comment over each `[rule.<id>]` header below is held to it.
#
# WHY THE SHAPE AND NOT THE STALENESS. A staleness check needs the record the
# number came from, and that record is exactly what a comment omits: the number
# is inline, the source is in somebody's terminal history, and no pattern can
# recover it. `doc-claims` records the same finding from the other side -- every
# attempt there to catch the UNANCHORED facts by pattern produced no true
# findings at any filter strength, because which record a value came from is
# what the prose leaves out. So this refuses the SHAPE, which is recognisable
# without knowing what the number measures: digits, optional space, a unit.
#
# THE REMEDY FOR A MEASUREMENT OF THE AUTHOR'S OWN DATA IS TO DROP IT. Delete
# the number; delete the sentence too, if it cannot stand without it. The
# argument a sentence makes almost always survives the number's removal --
# `most of the fleet pins no owner` carries the reader as far as a count taken
# one afternoon does, and it is still true next month. Where the exact figure
# is the point, it belongs in the commit or the pull-request body, which is a
# record with a date on it.
#
# WHAT IS NEVER THE REMEDY: SPELLING THE DIGITS OUT AS WORDS. A comment that
# says the same measurement in words states the same unanchored fact and goes
# stale on the same day; all that changed is that this pattern can no longer
# read it. That is not a fix, it is an exemption written in prose, and it is
# worse than an exemption in the policy file because nothing records that it
# was taken.
#
# WHAT IT LETS THROUGH, AND WHY EACH ONE HAD TO BE LET THROUGH. A version
# (`v1.14.1`, `Go 1.25`) is an identifier, not a quantity -- the digits belong to
# a name. A date (`2026-09-04`) is a point, not an amount. An ordinal or a
# citation (`ADR 0005`, `issue 101`) numbers a thing rather than measuring one.
# None of the three is followed by a unit, which is what the pattern requires,
# and a version with a unit welded onto the end of it is not a thing anyone
# writes.
#
# WHAT IT CANNOT TELL APART, and this is the cost, stated rather than hedged
# away. Not every number in a comment is the author's data. A platform constant
# (`the <n> KiB a pipe holds`), a limit the code itself enforces, a number in a
# worked example -- none of those was measured off a tree, and none of them can
# go stale the way a directory's size goes stale. Written in digits they read
# to this pattern exactly like a measurement, because the pattern reads a
# SHAPE. The alternative was a hedge that told the two apart by guessing, and
# every version of that guess lets a real measurement through, which is the one
# outcome nothing later can notice. So the rule refuses the shape and the
# READER decides which kind of number it is.
#
# AND WHEN THE READER DECIDES IT IS NOT THE AUTHOR'S DATA, the fix is to make
# the code own the number. A named constant the comment can point at puts the
# value where the code and the sentence cannot disagree; a worked example can
# usually be rewritten to make its point without a figure at all -- a file held
# under the limit by its baseline may not grow toward it. What is not available,
# here as anywhere in this set, is words for digits: the sentence would still
# carry a number nothing owns, and the only thing the rewrite bought was
# silence.
#
# `line` STAYS ON THE UNIT LIST DELIBERATELY. `# read once per <n> lines` is
# the same defect as `# <n> s timeout`: a count of a thing that changes,
# stated where nothing recounts it. It is the unit most likely to look
# harmless and is the one that goes stale on the next edit to the file it
# counts.
#
# SCOPED TO COMMENT OPENERS IN SOURCE FILES, and both halves of that matter. The
# line must open with `#`, `#:`, `//`, `///`, `--`, `/*` or `*` as its first
# non-blank token, so a string literal holding a measurement is code and is
# left alone. The file must be source, by extension, so a markdown bullet
# opening with `*` is never read -- prose in a document is the anchored-fact
# rule's subject, not this one's, and the two would otherwise disagree about
# the same line.

# WHAT THIS SET MAY INSTALL. Nothing: two checks over tracked files, read by
# `uphold scan` and by any stage the inheriting repository already runs. A
# measurement is wrong slowly and a restatement is wrong quietly, so there is
# no moment this has to stand in front of.
[set]
stages = []

[rule.no-user-data-measurement]
message = """
This comment states a measurement, and no anchor checks it -- the value was
true when it was written and nothing fails when it stops being. If it measures
your own data -- a size on disk, a count across a fleet, a duration timed on
one machine -- drop it: delete the number, and the sentence with it if it
cannot stand alone, or move the figure to the commit or pull-request body. If
the number is not yours to measure -- a platform constant, a limit the code
enforces, a worked example -- give the code the number, as a named constant
this comment can point at, or rewrite the example so it needs none. Do not
spell the digits out as words: that states the same fact and only hides it
from this rule.
"""
# THE COMMENT OPENER IS THE SCOPE, and the pattern carries it rather than a
# check kind: `^\s*(?:#:?|///?|--|/\*|\*)` says the line opens a comment, and
# the lazy run after it walks to the measurement. Read line by line, so `^` is
# the start of the line and `files.multiline` stays off.
#
# `(?:[^\n]*[^\w.-])?` IS THE LOOKBEHIND, WRITTEN FORWARD. The Rust regex crate
# has no lookaround, so the boundary in front of the digits is spelled as text
# that ends in a character which is neither a word character, a dot, nor a
# hyphen -- or as nothing at all, for the digit that follows the opener
# directly. Without it the `1` in `v1.14.1` and the `14` in it both open a
# match, and a rule that refuses every version string in every comment is a
# rule excluded wholesale.
#
# THE HYPHEN IS IN THAT CLASS FOR THE SAME REASON THE DOT IS. A hyphen joins a
# number to a name -- `UTF-8`, `ISO-8601`, `base-64` -- and the digits after it
# belong to an identifier rather than to a quantity. Without it, `a UTF-16 file`
# reads as sixteen files: that alone was most of the first run's findings in
# this repository, on comments holding no measurement at all.
#
# `%` SITS OUTSIDE THE `\b`, AND IT HAS TO. `\b` is a transition between a word
# character and a non-word one, so `%\b` requires a word character AFTER the
# percent sign: a percentage welded to the next word matches, and one followed
# by a space does not -- which is every percentage anybody writes. The word
# units need the boundary, because `s` inside `steps` and `line` inside
# `linear` are not units; `%` is not a word and needs no boundary to end it.
# So the tail is a choice between the two kinds rather than one list with one
# boundary bolted on the end.
regexp = '^\s*(?:#:?|///?|--|/\*|\*)(?:[^\n]*[^\w.-])?\d[\d_,.]*\s?(?:%|(?:MB|KB|GB|ms|s|sec|seconds?|minutes?|hours?|files?|lines?|bytes?)\b)|^\s*(?:#:?|///?|--|/\*|\*)[^\n]*\b\d+\s+of\s+\d+\b'
files.include = ["."]
files.glob = [
  "*.rs",
  "*.py",
  "*.go",
  "*.js",
  "*.ts",
  "*.tsx",
  "*.jsx",
  "*.c",
  "*.h",
  "*.cpp",
  "*.hpp",
  "*.java",
  "*.kt",
  "*.swift",
  "*.rb",
  "*.sh",
  "*.bash",
  "*.zsh",
  "*.fish",
  "*.toml",
  "*.yaml",
  "*.yml",
  "*.sql",
  "*.lua",
  "*.php",
  "*.cs",
]
# NO TEST EXCLUSION, unlike most of the rules in `process-residue`. The
# allowance there is earned: a fixture legitimately carries example-bad
# content, so a credential in a test is a credential the test is ABOUT. Nothing
# of the kind holds here. A measurement in a test's comment -- how long a
# fixture took, how many paths the pipe carried -- rots exactly as a
# measurement in a source comment rots, and it is read by exactly the same
# person on exactly the same day. A directory a rule silently skips is a
# directory it says nothing about, and saying nothing is how this whole class
# of defect survived in the first place.

# A COMMENT THAT SAYS WHAT THE NEXT LINE SAYS. `# the runner is ubuntu-latest`
# over `runner = "ubuntu-latest"` states no measurement, names no tracker and
# carries no history, so every rule that judges a comment's text on its own
# lets it through; what is wrong with it is only visible beside the line it
# sits on. It belongs in this set because it is the same defect as the rule
# above from the other side: that one refuses a claim the code cannot check,
# this one refuses a claim the code already makes.
#
# THE TEST IS A SUBSET AND NOT A LIST OF BORING VERBS. Every word the comment
# contributes -- filler like `the` and `is` removed -- has to be a word the
# line beneath it already spells, counting the identifiers split on case,
# underscore and hyphen and the words inside string values. A comment carrying
# one word the line lacks is saying something, whatever the word is, and a
# comment carrying `because`, `unless`, `otherwise` or any other word that
# opens a reason is never judged at all. So is one holding a link, a number
# with a unit, a worked example, a parenthesised aside, or more than a
# handful of words: each of those is doing something other than repeating.
#
# THE REMEDY IS A WHY, A CONSTRAINT OR A CONSEQUENCE. The comment worth having
# over `runner = "ubuntu-latest"` says what breaks on another runner; a comment
# that cannot say that is deleted, not reworded, because a synonym for the
# identifier restates it in a form this rule can no longer read and a reader
# still skips.
#
# TESTS ARE EXCLUDED, and this is the one rule in the set with an exclusion.
# The measurement rule reads a test because a stale number rots there as it
# rots anywhere. A restatement in a test is different in kind: the comment
# above an assertion names the CASE rather than the code -- `# the default
# runner` over the line that sets it is what tells a reader which of nine
# fixtures this one is -- and refusing it would refuse the label. A test is
# a directory named for one, a Go file named `_test`, or a Python file named
# `test_` or `_test`: the three spellings the languages this check reads put
# a test beside its code under.
#
# THE GLOB NAMES THE EXTENSIONS THE CHECK CAN READ AND NO OTHER. A comment
# rule that selects only files it cannot read is refused as a rule its author
# believes runs, and a set inherited by a tree of Markdown must never trip
# that: the glob is what keeps the selection inside the readable kinds. The
# check also reads an extensionless dotfile such as `.gitignore`, and no glob
# here selects one, because the pattern that would -- `.*` -- selects
# `.eslintrc.json` and every other dotted file the check cannot read, and a
# tree where those are the whole selection would be refused for it.
[rule.no-restated-line]
message = """
This comment says what the next line already says. State a why, a constraint
or a consequence, or delete it.
"""
trivial_comments = true
files.include = ["."]
files.glob = [
  "*.rs",
  "*.py",
  "*.pyi",
  "*.go",
  "*.toml",
  "*.yaml",
  "*.yml",
  "*.sh",
  "*.bash",
  "*.zsh",
  "*.fish",
  "*.ini",
  "*.cfg",
]
files.exclude = [
  "**/tests/**",
  "**/test/**",
  "**/*_test.go",
  "**/test_*.py",
  "**/*_test.py",
]
