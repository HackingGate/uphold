# Base rule set: doc-claims (a document's stated fact must still be true)
#
# A marker that names where a fact lives, checked against the file it names.
# Pull in with:
#
#   [inherit]
#   sets = ["process-residue", "doc-claims"]
#
# WHAT IT IS ABOUT. `broken-links` resolves a path a reader would CLICK. This
# resolves a VALUE a reader would believe. Both are prose that happens to be
# checkable, and both fail the same way: silently, forever, with every gate in
# every repository still green. A sentence such as "its `blast_radius` is
# `withdraw` rather than `trade` because ..." was true when it was written, and
# nothing anywhere fails on the day the record changes.
#
# THE SHAPE. A document that leans on a value carries a marker naming where the
# value lives and what it says. Two forms, one per kind of source:
#
#   <!-- fact-anchor: source=config/services/db.yaml key=read_path states=api -->
#   #   fact-anchor: source=config/accounts.toml key=sbi.tier states=broker
#   //  data-anchor: artifact=captures/*/filing.json states=the issuer's own NAV
#
# `fact-anchor` names a file somebody here EDITS -- YAML, TOML or JSON -- and a
# dotted key into it, where an integer segment indexes a list. `states` is the
# value the prose relies on and runs to the end of the marker, because a stated
# value has spaces in it often enough that stopping at the first one would
# silently compare half of it. A trailing `-->` or `*/` is not part of it.
#
# `data-anchor` names a file NOBODY here controls -- a captured document, a
# filing, a fixture -- as a glob, and the check is only that it is PRESENT. The
# value inside it is not compared, because the whole point of a captured
# artifact is that this repository does not get to say what it contains. What
# fails is a literal standing in for a document that was never captured.
#
# THREE WAYS TO FAIL, AND THEY ARE ONE DEFECT IN THREE COSTUMES: the source is
# gone, the key is gone, or the value has moved. The document is wrong in
# exactly the same way in each, and reads exactly as confident.
#
# WHAT IT DELIBERATELY CANNOT DO, because an instrument that reads healthier
# than it is is worse than none. It does not read English. No check can look at
# "Not yet recorded" and know that it asserted something machine-checkable --
# the author believed the sentence when writing it. So this covers facts
# somebody DECLARED as facts by anchoring them, which is worth having and is
# not the same as solving the problem.
#
# Measured, in the tree this was promoted from: every attempt to find the
# unanchored ones by pattern failed. 292 candidate spans narrowed to 42 to 10
# across four filter strengths, with ZERO true findings at any of them --
# because a document quoting `none` is right for three records and wrong for a
# fourth, and WHICH RECORD is exactly what the prose omits. That omission is
# why the marker carries `source=` and `key=` in the first place. A rule able
# to infer the record would not need the anchor.
#
# The durable fix is one layer up: a document that must show current state
# should RENDER it, and then it cannot drift at all. An anchor is for the
# sentence that needs the value inline to make its reasoning parse, where
# rendering would break the prose.
#
# WHY `require_any_anchor` IS NOT THE DEFAULT, unlike `require_any_link` in
# `broken-links`. There the floor is right: a repository with markdown and no
# links has almost certainly had its selection narrowed out from under it. Here
# zero is the GOAL STATE -- it means every fact is rendered or read at runtime
# and no sentence needed pinning -- so a floor would refuse the best outcome
# this set can produce. A repository that has decided its anchors are
# load-bearing writes `require_any_anchor = true` under this id, and that is a
# decision recorded in the policy instead of a silence.
#
# What is NOT optional is that the count is reported. A check that examined
# nothing and said so is not the failure this catalog guards against; a check
# that examined nothing and stayed silent is.
#
# ONE TRAP, AND IT IS THE FIRST ONE A REPOSITORY HITS. A document that DEFINES
# this convention -- a contributing guide showing the marker, a reference page
# like the one shipped beside this set -- carries a marker as a SYNTAX EXAMPLE
# and is read here as declaring one, against a `source=` that was never meant to
# exist. The answer is `files.exclude` naming that document, written under this
# id, which is the same shape every other rule uses to say "not here" and leaves
# the exclusion visible in the policy rather than buried in the checker.

# WHAT THIS SET MAY INSTALL. `stages` is the ceiling, and an empty list means
# no git hook at all: the rule here is a content rule the scan owns.
[set]
stages = []

[rule.no-stale-anchored-fact]
message = """
A document states a fact that has moved. The anchor beside the sentence names
where the value lives, and the file it names now says something else -- or no
longer has the key, or is gone. Re-read the source and correct the sentence, or
drop the anchor if the sentence no longer needs the value inline. The document
was true when it was written, which is why nothing has failed until now.
"""
builtin = "anchors-resolve"
files.include = ["."]
