# Base rule set: stale-pins (a hook pinned at a version its upstream has left)
#
# The guard that asks every hook configuration in the tree whether the revisions
# it pins still name anything, and whether the tag they name is still the
# newest. Pull in with:
#
#   [inherit]
#   sets = ["process-residue", "stale-pins"]
#
# SEPARATE FROM EVERY OTHER GUARD SET, AND THE REASON IS THE NETWORK. This is
# the only bundled rule that talks to a remote. That makes it the only one whose
# verdict depends on where the machine running it is standing: on a train, in a
# locked-down runner, behind a proxy that rewrites git URLs, the question cannot
# be answered at all. It answers exit 2 there rather than 0 -- a pin that could
# not be checked is not a pin that passed -- and a repository that cannot live
# with a network-dependent gate should not inherit this set. That decision is
# the whole reason it has a name of its own.
#
# WHAT IT REFUSES. A `rev:` in a .pre-commit-config.yaml, or a `ref:` under a
# lefthook `remotes:`, that names a tag its upstream has moved past, or that
# names nothing at all. Read at any depth in the work tree, because a pin in
# `sub/.pre-commit-config.yaml` is a pin a run touches. A tree holding no hook
# configuration of either manager is exit 2 and not a clean pass: zero pins
# found is not zero pins to find.
#
# A bare sha naming no tag passes, deliberately: a sha is neither behind a tag
# nor missing, and reporting it would make the one form that cannot drift the
# form that fails.
#
# THE STAGE IS `manual` ALONE, AND THE FLEET SETTLED THAT BEFORE THIS FILE DID.
# A survey on 2026-09-05 of the 85 sibling repositories that carry a
# `policy/principles.toml` found all 85 inheriting this set, and 79 of them
# shadowing `[rule.no-stale-hook-pins]` with a body byte-identical to the one
# below except for `git.hooks = ["manual"]`. The reason they record is the
# reason here: "At pre-push an unrelated upstream patch release blocks the next
# push of work that has nothing to do with it, which is how a gate gets bypassed
# by reflex. At manual, CI says the pin is stale and the push still lands." A
# default that 79 of its 85 inheritors override with the same line is the wrong
# default, and the 79 transcriptions it forced are the drift `policy/base/`
# exists to end.
#
# The six repositories that inherited it without shadowing -- VfioPlane/* --
# move from `pre-push` to `manual` with this change, and lose the refusal that
# stood in front of a push. What replaces it is the sweep the other 79 have been
# reading this verdict from all along: a `manual` run in CI, which reports a
# stale pin without holding the unrelated work that happened to be pushed next.
#
# It stays off `pre-commit` for the older reason, unchanged: one network round
# trip per pinned repository in front of every commit is a check that gets
# commented out.
[set]
stages = ["manual"]

[rule.no-stale-hook-pins]
builtin = "no-stale-hook-pins"
git.hooks = ["manual"]
