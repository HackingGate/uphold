[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
#
# Linux and macOS. The macOS builds run on macOS runners, because dist refuses
# to cross-compile to a Darwin target from a host that is not itself macOS
# (`build_wrapper_for_cross` in cargo-dist's src/tasks.rs returns
# UnsupportedCrossCompile). They were left out while Actions minutes were the
# constraint. Judged again on 2026-11-08: GitHub's billing documentation says
# standard GitHub-hosted runners, macOS included, are free and unlimited in
# public repositories, which this is, so a macOS job costs latency and one of
# five concurrent macOS slots, not minutes. Windows is not a target: the shim is
# a PATH symlink to this binary under each command's name (`std::os::unix`),
# and the binary does not build there.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Attach a GitHub build provenance attestation to every artifact
github-attestations = true
# In the host job, over `artifacts/*`, and not in the build job. The build-job
# step dist 0.33.0 generates is `subject-path: "target/distrib/*${{
# join(matrix.targets, ', ') }}*"`, and with `merge-tasks = true` that one job
# holds all four targets: actions/attest splits the joined string on commas into
# patterns of which none names a tarball. Every release from 2026-09-19, when
# merge-tasks was turned on, through v1.48.0 shipped with no attestation on any
# archive, while the release notes told users to run `gh attestation verify`.
# The host job sees every file
# the release publishes -- archives, installer, schema -- in one directory, so
# the subject is one glob with no join. Checked against cargo-dist main on
# 2026-11-08: the build-job template still joins with ", ".
github-attestations-phase = "host"
# No run on pull requests: a `dist plan` on every pull request is Actions
# minutes spent on a question the tag push answers. The tag push is the whole
# trigger list; `dispatch-releases` is not set because dist takes it as a
# replacement for the tag trigger rather than an addition to it.
pr-run-mode = "skip"
# Dependabot's github-actions entry moves the `uses:` pins in the generated
# workflow, and `dist plan` refuses a workflow that differs from what it would
# generate. This keeps the release running across such a bump; the next
# `dist generate` rewrites the file with dist's own pins and Dependabot moves
# them again.
allow-dirty = ["ci"]
# One job builds every target rather than one job per target. The per-job
# setup (checkout, toolchain, dist and cargo-zigbuild installs, registry
# fetch) is paid once, and the host-side build scripts and proc macros in
# `target/` are compiled once and shared across the four targets. The
# price is latency, since the targets build in sequence, and fault isolation,
# since one failing target fails the job.
merge-tasks = true

# Every target builds on the one x86_64 Linux runner. Without this table dist
# schedules `ubuntu-22.04-arm` for the aarch64 Linux targets: a second runner
# class, with its own rate and its own setup cost, for a build the Linux
# runner can do itself. With `host` set to the runner's own triple, dist sees
# a cross-compile and drives `cargo zigbuild` for the aarch64 targets
# (`build_wrapper_for_cross` in cargo-dist's src/tasks.rs picks cargo-zigbuild
# for any Linux target from a Linux host), installing cargo-zigbuild in the
# job through pip. The x86_64 musl target is the same OS and architecture as
# the host, so dist calls plain `cargo build` for it, as it already did.
#
# None of these entries sets a `container`. zizmor.yml ignores the
# `unpinned-images` finding on release.yml's `container:` line because of that.
# An entry that adds a container has to name the image by digest
# (`image@sha256:...`) here, since that ignore would hide an unpinned one.
# The macOS runners, named rather than left to dist's defaults: dist 0.33.0
# picks macos-14 for Apple silicon, which GitHub's list of standard runners for
# public repositories no longer carries (checked 2026-11-08), while macos-15
# (arm64) and macos-15-intel are both on it. Each builds natively for its own
# architecture.
[dist.github-custom-runners.aarch64-apple-darwin]
runner = "macos-15"

[dist.github-custom-runners.x86_64-apple-darwin]
runner = "macos-15-intel"

[dist.github-custom-runners.aarch64-unknown-linux-gnu]
runner = "ubuntu-latest"
host = "x86_64-unknown-linux-gnu"

[dist.github-custom-runners.aarch64-unknown-linux-musl]
runner = "ubuntu-latest"
host = "x86_64-unknown-linux-gnu"

[dist.github-custom-runners.x86_64-unknown-linux-musl]
runner = "ubuntu-latest"
host = "x86_64-unknown-linux-gnu"

[dist.github-custom-runners.x86_64-unknown-linux-gnu]
runner = "ubuntu-latest"
host = "x86_64-unknown-linux-gnu"

# The policy file's JSON Schema, as a release asset with a `.sha256` beside it,
# so a `#:schema` line in a consumer's policy can name an address that is
# immutable per release. dist writes a `.sha256` for the archives and the source
# tarball only, and its unified `sha256.sum` lists those too; an extra artifact
# gets neither, so the command writes its own. `sha256sum` prints the name as
# given, which is why it runs where the copy was written.
[[dist.extra-artifacts]]
artifacts = ["principles.schema.json", "principles.schema.json.sha256"]
build = ["sh", "-c", "cp docs/schema/principles.schema.json principles.schema.json && sha256sum principles.schema.json > principles.schema.json.sha256"]
