[[sources]]
title = "Assessing the impact of planned social change"
url = "https://doi.org/10.1016/0149-7189(79)90048-X"
type = "paper"
notes = "Campbell, Evaluation and Program Planning 1979. States the parallel law: the more a quantitative indicator is used for social decision-making, the more it is subject to corruption pressures and the more it distorts the processes it monitors."
