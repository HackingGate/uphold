# What a lefthook consumer includes.
#
# lefthook has no manifest format of its own to publish hooks in, the way
# pre-commit and prek share `.pre-commit-hooks.yaml`. What it has is `remotes`:
# a consumer names this repository and this file, lefthook clones it and merges
# the result into their own `lefthook.yml`. So this file is the lefthook
# equivalent of that manifest, and it is kept in step with it by the CI matrix
# that runs all three runners over the same consumer tree.
#
#   # lefthook.yml, in the consuming repository
#   remotes:
#     - git_url: https://github.com/HackingGate/uphold
#       ref: v1.7.0
#       configs:
#         - hooks/lefthook.yml
#
# Then `lefthook install`.
#
# The one difference from the other two runners is where the binary comes from.
# pre-commit and prek build it themselves, because `language: rust` is part of
# their manifest contract; lefthook runs commands and has no such contract, so
# `uphold` must be on PATH:
#
#   cargo install --git https://github.com/HackingGate/uphold --tag v1.7.0
#
# The names below are prefixed `uphold-` on purpose. A remote config is
# merged into the consumer's own, and two commands sharing a name under one hook
# is one command silently replacing the other.

pre-commit:
  parallel: true
  commands:
    uphold-scan:
      run: uphold scan
    uphold-guard:
      run: uphold guard --stage pre-commit
  # The declaration check fires on a CONDITION rather than on every commit, which
  # is why it is a job and not another command: `glob` is a job key.
  #
  # It arrived as a `script:` onto `.lefthook/pre-commit/uphold-check` while the
  # checker was a Python file in this repository that PATH could not reach --
  # lefthook's `scripts` is the one mechanism that resolves against the remote
  # clone rather than the consumer's tree. The reconcile is `uphold check` now,
  # so it is on PATH like every other command here and the shim is gone.
  #
  # .pre-commit-hooks.yaml publishes the same condition as a `files:` regex, and
  # the two lists are the same list file for file: the declaration itself, plus
  # every file a claim is reconciled against. Those are exactly the edits that
  # can turn a true enforcement claim into a false one. Two distribution paths
  # that fire on different occasions are two products wearing one version
  # number, and the one that fires more is the one a consumer switches off.
  jobs:
    - name: uphold-check
      run: uphold check
      glob: "{policy/upheld.toml,policy/principles.toml,.pre-commit-config.yaml,lefthook.yml}"

    # ── the Go toolchain ─────────────────────────────────────────────
    #
    # Four jobs that run no uphold code and need no uphold binary. They are
    # published because a fleet audit read 24 sibling repositories side by side
    # and found these four hand-copied as local declarations -- and found that
    # two of the 24 gofmt copies could never exit nonzero, because `gofmt -l`
    # prints the files it would reformat and exits 0 either way. The reasoning
    # is in .pre-commit-hooks.yaml, which publishes the same four ids under the
    # same names; this file is the lefthook half of that one list.
    #
    # `glob:` is what makes them fire in no repository without Go in it, and it
    # is the same list .pre-commit-hooks.yaml spells as a `files:` regex:
    #
    #   glob: "{*.go,*go.mod,*go.sum}"   <->   files: '(\.go|go\.mod|go\.sum)$'
    #
    # The two select the same paths. lefthook's `*` crosses a path separator, so
    # `*.go` reaches `internal/x/y.go` and `*go.mod` reaches a nested module's
    # `go.mod`; the regex is anchored only at the end, so it reaches both as
    # well -- and both spellings over-select a file named `cargo.mod`, in the
    # same way. Two triggers that disagreed would be the forked copy this
    # section exists to end, one level up.
    #
    # Jobs rather than commands for the reason uphold-check is one: `glob` is a
    # job key, and a Go hook with no condition on it is the full test suite in
    # front of every commit in the repository, Go or not.
    - name: uphold-gofmt
      # `gofmt -l` is a REPORT and not a gate, so the EMPTINESS of its output is
      # the verdict and emptiness is what is tested here. The list is printed
      # before the refusal, because a gate that fails without naming what failed
      # is the next one somebody deletes.
      run: unformatted="$(gofmt -l .)"; [ -z "$unformatted" ] || { echo "gofmt would reformat these files; run gofmt -w ."; echo "$unformatted"; exit 1; }
      glob: "{*.go,*go.mod,*go.sum}"
    - name: uphold-go-vet
      run: go vet ./...
      glob: "{*.go,*go.mod,*go.sum}"
    - name: uphold-go-build
      # `-o` into a throwaway directory rather than a bare `go build ./...`, and
      # it is not tidiness. Where `./...` resolves to several packages go
      # discards what it built; where it resolves to a SINGLE main package go
      # writes the executable into the working directory -- so the job that
      # checks the tree compiles leaves an untracked binary in the tree it just
      # checked, in exactly the repositories small enough to have one package.
      # The status is carried across the cleanup because `rm` succeeding must
      # not become the answer.
      run: out="$(mktemp -d)"; go build -o "$out" ./...; status=$?; rm -rf "$out"; exit $status
      glob: "{*.go,*go.mod,*go.sum}"
    - name: uphold-go-test
      run: go test ./...
      glob: "{*.go,*go.mod,*go.sum}"

commit-msg:
  commands:
    uphold-scan-text:
      run: uphold scan --text {1}
    uphold-guard:
      run: uphold guard --stage commit-msg --message {1}

pre-merge-commit:
  commands:
    uphold-guard:
      run: uphold guard --stage pre-merge-commit

pre-push:
  commands:
    # `use_stdin: true` is not optional here and its absence does not look like
    # a bug. lefthook runs a command under a pseudo-TTY by default, and that
    # stdin never closes -- so a reader either hangs or, worse, sees nothing and
    # calls it an empty push. The binary refuses that third case rather than
    # falling through to the working tree, but the refusal is a failed push and
    # this line is what prevents it.
    uphold-guard:
      use_stdin: true
      run: uphold guard --stage pre-push --remote {1} --remote-url {2}

# The stages that are too slow to sit in front of a commit: the tree-wide name
# scans and the pin check each ask the forge over the network, once per distinct
# name or pin. `lefthook run uphold-manual` is how CI and a scheduled run
# reach them, which is what turns "whoever pushes next finds out" into something
# a schedule finds on its own.
uphold-manual:
  commands:
    uphold-scan:
      run: uphold scan
    uphold-guard:
      run: uphold guard --stage manual

# The four Go jobs are NOT repeated here, and .pre-commit-hooks.yaml declares
# them `stages: [pre-commit]` for the same reason rather than the
# `[pre-commit, manual]` every other id there carries. Measured against lefthook
# v2.1.9: `glob` is applied to the files a GIT HOOK is running over, and a named
# group like this one has no such set -- every job in it runs, glob or no glob.
# So a Go job here fires in a repository with no Go in it and fails for want of
# a module, which is the one thing these four are published not to do. Making
# the two files disagree about which stages the ids reach, to keep a manual
# sweep this runner cannot condition, would be the forked declaration the ids
# exist to end.
