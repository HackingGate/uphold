name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# A warning is a failure everywhere, not only where a step remembered to say so.
# The lint profile in Cargo.toml denies the whole pedantic/nursery set for this
# crate's own code; RUSTFLAGS carries the same answer into the dependency builds
# and into the jobs below that build a throwaway consumer rather than this tree.
#
# LEFTHOOK_VERSION is here rather than beside each install because two jobs
# install the same binary, and a version written twice is a version that only
# ever agrees by accident.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  LEFTHOOK_VERSION: 2.1.9

jobs:
  unit-tests:
    name: catalog and checker tests
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7

      # The Python below is stdlib-only, so what this pins is the INTERPRETER
      # and nothing else. `ubuntu-slim` ships whatever python3 it ships, and
      # `scripts/` reads Cargo.toml with `tomllib`, which is 3.11 or newer --
      # a runner image refresh is the whole distance between that working and
      # not. `uv run --no-project` chooses instead of inheriting.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: Validate the catalog
        run: uv run --no-project scripts/validate.py

      - name: Generated reference and name index are current
        run: uv run --no-project scripts/build_reference.py --check

      - name: Behaviour tests
        run: uv run --no-project python -m unittest discover -s tests

  engine:
    name: scan engine
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # The debug target directory this job fills is the same one the three
      # `hooks` legs fill: same toolchain, same lockfile, same profile. Four
      # caches of it were four ~124MB uploads per commit that evicted each
      # other, so they share one key and this job is the only writer -- a
      # reader that also wrote would race the other three for the same slot and
      # win with whatever subset of the tree its own commands happened to build.
      #
      # Written from main only. A pull request restores that cache through the
      # prefix restore-key and builds the delta; letting it write back would
      # spend the upload on a key nothing else will ever ask for.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: stable-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The same preflight a contributor runs, on the runner that is supposed to
      # satisfy it. A manifest nothing reads goes stale the first time a tool is
      # added and declared nowhere.
      - name: Host toolchain preflight
        run: ./scripts/deps.sh check

      - name: Build and test
        run: cargo test --locked

      - name: Lints
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings

      # The gate this repository ships, run against this repository. A content
      # policy whose own tree does not pass it is one nobody should adopt.
      - name: The policy over its own tree
        run: cargo run --locked --quiet -- scan

  # `rust-version` in Cargo.toml is a promise to anyone who builds this, and the
  # job above cannot keep it: it runs whatever `stable` is this week, so a
  # dependency bump or a newer-than-MSRV language feature lands green and breaks
  # for the reader on the version the manifest claims to support. The toolchain
  # is READ from that manifest rather than written here -- a second copy of the
  # number would be the one that goes stale, and it would go stale silently in
  # the direction that passes.
  msrv:
    name: MSRV
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: Read the MSRV from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          version="$(uv run --no-project python -c '
          import sys, tomllib
          with open("Cargo.toml", "rb") as fh:
              v = tomllib.load(fh)["package"].get("rust-version")
          if not v:
              sys.exit("Cargo.toml declares no rust-version")
          print(v)
          ')"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "MSRV is $version"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      # Its own key, because the compiler differs from the stable jobs' and a
      # target directory built by one is not readable by the other.
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `check`, not `test`: what MSRV promises is that the crate and its pinned
      # dependency graph COMPILE on that compiler. Behaviour is the stable job's
      # question and running it twice buys nothing.
      - name: Compiles on the declared MSRV
        run: cargo check --locked --all-targets

  # Coverage is collected here and nowhere else, but the floor it is held to
  # lives in scripts/coverage.sh, which the manual hook runs too -- so the number
  # that fails a push is the number a contributor can reproduce before pushing.
  coverage:
    name: coverage
    runs-on: ubuntu-slim
    # Lifted to the job so the upload step can ask whether it is set: the
    # `secrets` context is not readable from a step's `if`, and a step that
    # cannot ask is one that runs and fails on a repository with no token.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      # Also its own key: this tree is built instrumented, so it shares nothing
      # with the stable jobs' target directory beyond the dependency sources.
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,nextest

      # nextest gives each test its own process, which is what makes the
      # integration suites count: they spawn `uphold` rather than calling
      # into a library -- this crate has no lib target -- and the instrumented
      # child writes its own profile.
      - name: Coverage, against the committed floor
        run: ./scripts/coverage.sh --lcov lcov.info

      # The report is an extra, not the gate. A fork, or a repository whose
      # token has not been set, still gets the step above.
      - name: Upload to codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: true

  hooks:
    name: ${{ matrix.tool }}
    runs-on: ubuntu-slim
    # Coverage has its own job, with the toolchain it needs and a cache that
    # survives; running it once per runner here would build the tree
    # instrumented three more times to answer the same question. What this job
    # asks is whether each runner can DRIVE the configuration, and the hooks
    # left in it answer that.
    env:
      SKIP: coverage
      # The private-name guards ask the forge whether a name is a private
      # repository, and they ask through `gh`. With no token `gh` answers
      # nothing -- and until an unaskable forge became its own state, that was
      # reported as an inconclusive finding and passed. So this job has been
      # running the private-name family over a tree full of `acme/widget` and
      # reaching a verdict on none of it: the check was vacuous here, and
      # nothing said so.
      #
      # The job token is enough, and is deliberately the weakest thing that
      # works: it reads this repository and public ones, and answers 404 for
      # everything else -- which is the right answer for an invented name in a
      # document, and the same answer a contributor's own `gh` gives for a
      # private organisation they are not a member of.
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        tool: [pre-commit, prek, lefthook]
    steps:
      - uses: actions/checkout@v7

      # Four hooks in .pre-commit-config.yaml are `language: system` and spelt
      # `uv run --no-project ...`, so uv has to be on PATH for the runner that
      # drives them. prek fetches a uv of its own into its cache for
      # `language: python` hooks, and that copy is not on PATH -- which is what
      # this job failed on when the hooks moved off bare `python3`.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0

      # The `rg` executable is no longer a dependency: the search stack is
      # linked into `uphold`, so there is nothing left to shell out to. A
      # Rust toolchain is, because this repository runs its own gate from the
      # working tree rather than from a released wheel.
      #
      # With the components, because the manual stage this job runs includes the
      # host preflight and toolchain.toml requires them. A runner that cannot
      # satisfy the manifest is not a runner this repository can be developed
      # on, and finding that out here is the point of asking.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Read-only, against the key the `engine` job writes. All three legs build
      # the same debug tree with the same toolchain, so three private copies of
      # it bought nothing but eviction pressure; and a leg that wrote back would
      # be racing the other two and `engine` for one slot.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: stable-debug
          save-if: 'false'

      # ── pre-commit (Python) ──────────────────────────────────────
      - if: matrix.tool == 'pre-commit'
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --hook-stage manual

      # ── prek (Rust) ─────────────────────────────────────────────
      - if: matrix.tool == 'prek'
        uses: j178/prek-action@v2
        with:
          extra-args: --all-files --hook-stage manual

      # ── lefthook (Go) ───────────────────────────────────────────
      - if: matrix.tool == 'lefthook'
        uses: actions/setup-go@v7
        with:
          go-version: '>=1.26'

      # The published binary rather than `go install`, which spent about a
      # minute and a half compiling lefthook from source on every run to
      # produce the same program. The download is checked against the
      # checksum file the release ships, so what lands on PATH is still
      # established rather than assumed.
      #
      # Into a temporary directory, not the workspace: the hooks this job then
      # runs walk the tree, and a downloaded archive sitting in it is a file
      # the content policy would be asked about.
      - if: matrix.tool == 'lefthook'
        name: lefthook ${{ env.LEFTHOOK_VERSION }}
        run: ./scripts/install_lefthook.sh

      # actionlint stays a `go install`, and unpinned. Nothing watches a version
      # written in a workflow file -- Dependabot reads no such pin and
      # `no-stale-hook-pins` reads hook configs -- so a number here would be one
      # more copy going stale in the direction that passes.
      - if: matrix.tool == 'lefthook'
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # lefthook has no managed environments: every command in lefthook.yml is
      # whatever the host has on PATH. pre-commit and prek install ruff,
      # shellcheck and bashate from the pinned hook repos, so on those two
      # runners this step has no equivalent -- which is exactly why it is easy to
      # forget here and find out from a green run that skipped the check.
      - if: matrix.tool == 'lefthook'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          pipx install bashate
          pipx install ruff

      - if: matrix.tool == 'lefthook'
        run: lefthook run pre-commit --all-files

      # The manual-stage pair, at the seam lefthook has for them. Coverage is
      # left to its own job on every runner; this proves the preflight group is
      # reachable and passes on the runner the other two jobs also use.
      - if: matrix.tool == 'lefthook'
        run: lefthook run preflight

  # The runner matrix above runs THIS repository's own configuration. That is a
  # different question from whether a repository that is not this one can pin
  # these hooks and have them work, and every bug the parity work found lived in
  # the gap: hook ids nothing published, a seam predicate matching only this
  # repository's own hook names, a base set resolved against a directory only
  # this repository has, and a pre-push guard reading a channel two of the three
  # runners do not use. All four were green here and broken there.
  #
  # So each runner drives a throwaway consumer through the same four questions,
  # and "supports lefthook" means what "supports pre-commit" means.
  runner-parity:
    name: consumer under ${{ matrix.tool }}
    runs-on: ubuntu-slim
    strategy:
      fail-fast: false
      matrix:
        tool: [pre-commit, prek, lefthook]
    steps:
      - uses: actions/checkout@v7

      # pre-commit and prek bootstrap their own Rust; lefthook has no manifest
      # contract and no language to bootstrap, so the binary has to be built and
      # put on PATH the way the install instructions tell a consumer to.
      #
      # Which is why the toolchain is gated rather than installed for the whole
      # matrix. "No Rust toolchain needed -- `language: rust` bootstraps" is a
      # claim README.md makes to consumers and .pre-commit-hooks.yaml repeats,
      # and a step that puts a compiler on PATH before either runner starts is
      # the one thing that makes the claim untestable: both legs would find
      # cargo already there and pass whether or not the bootstrap works. The
      # only leg that may have a toolchain handed to it is the one whose install
      # instructions say to build the binary yourself.
      #
      # The cache is gated on the same condition and not on taste. Swatinem's
      # action shells out to cargo to key itself, so on a leg that is
      # deliberately without one it is a step that fails for a reason unrelated
      # to what this job asks -- and it has nothing to cache there either,
      # because pre-commit and prek build inside their own environment
      # directories rather than into this workspace's target/.
      - if: matrix.tool == 'lefthook'
        uses: dtolnay/rust-toolchain@stable

      #
      # Read-only against the release key the `consumer` job writes: both build
      # `--release` from this same tree with this same toolchain, so the second
      # copy of that cache was a second 72MB upload of a directory that already
      # existed.
      - if: matrix.tool == 'lefthook'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: stable-release
          save-if: 'false'

      # Both are on PyPI and both are installed the same way here, deliberately:
      # what differs between them is what this job is measuring, so nothing else
      # about the two setups should.
      - if: matrix.tool == 'pre-commit' || matrix.tool == 'prek'
        run: pipx install "${{ matrix.tool }}"

      # Go on every leg, and it is not the lefthook binary's toolchain -- that
      # is the step below. The consumer harness's ninth question drives the four
      # published Go ids, which are `language: system` and use whatever `go` the
      # consumer has, so all three runners need one to drive them with.
      #
      # This does not weaken the gate above. What that gate protects is the "no
      # Rust toolchain needed" claim, and Rust is still absent from the two legs
      # whose runners are supposed to bootstrap it themselves. A Go toolchain
      # proves nothing about a Rust bootstrap in either direction, and the four
      # ids it is here for run no uphold code at all.
      - uses: actions/setup-go@v7
        with:
          go-version: '>=1.26'

      - if: matrix.tool == 'lefthook'
        run: ./scripts/install_lefthook.sh

      - if: matrix.tool == 'lefthook'
        run: |
          cargo build --release
          echo "$GITHUB_WORKSPACE/target/release" >> "$GITHUB_PATH"

      # A consumer pins a ref, so the checkout has to be reachable as one. The
      # ref is this workspace's own HEAD: what is under test is the commit, not
      # whatever tag happens to be newest.
      - name: A consuming repository, driven by ${{ matrix.tool }}
        run: |
          git config --global user.email ci@example.test
          git config --global user.name CI
          ./scripts/consumer_check.sh "${{ matrix.tool }}" "$GITHUB_WORKSPACE" "$(git rev-parse HEAD)"

  consumer:
    name: consumer integration
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7

      # The reconcile is the binary's now, so this job needs one. It builds
      # rather than pinning a release because what is under test is this
      # commit's reconcile against this commit's manifest.
      - uses: dtolnay/rust-toolchain@stable

      # This job had no cache at all, so it paid a cold release build -- over
      # two minutes -- on every run, while the parity job next to it kept a warm
      # copy of the same directory. One key now, written here and read there.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: stable-release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo build --release

      # A hook is only proven by the path a consumer takes: a repository that
      # is not this one, declaring a profile, running the released entry point.
      - name: A consuming repository's declaration
        run: |
          set -euo pipefail
          mkdir -p /tmp/consumer/policy
          ./uphold_check.py --init > /tmp/consumer/policy/upheld.toml
          cp -r policy/principles.toml /tmp/consumer/policy/principles.toml
          cd /tmp/consumer && "$GITHUB_WORKSPACE/target/release/uphold" check

      - name: A declaration that cannot be read is not a pass
        run: |
          set -euo pipefail
          mkdir -p /tmp/unreadable
          cd /tmp/unreadable
          set +e
          "$GITHUB_WORKSPACE/target/release/uphold" check
          status=$?
          set -e
          test "$status" -eq 2 || { echo "expected exit 2, got $status"; exit 1; }
