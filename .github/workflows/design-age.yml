name: Design record age

on:
  issues:
    types: [opened, reopened, labeled, unlabeled]
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  ruling-window:
    name: Open Design records have a ruling
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check ruling labels and pending age
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/design_age.py
