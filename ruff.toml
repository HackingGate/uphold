# Ruff config for the catalog scripts and the declaration checker.
target-version = "py311"

[lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
  "E501",    # line length is left to the formatter; long strings/URLs are fine
  "RUF001",  # allow ambiguous unicode in strings (matches the org ruff config)
]
