# What a pre-commit or prek consumer can pin.
#
# prek reads this file, not a file of its own: it is a reimplementation of the
# same manifest format, and every `language:` used below is one it supports. So
# "supports prek" is not a second surface to maintain -- it is a claim about
# which languages this file is allowed to use, and the CI matrix is what keeps
# the claim true. lefthook has no equivalent format; it consumes `lefthook.yml`
# from a remote repository instead, which is what `hooks/lefthook.yml` is for.
#
# `language: rust` for every id that runs the binary, and it is not a toolchain
# requirement being pushed onto the consumer: both runners bootstrap Rust
# themselves when it is absent. Those hooks build ONE environment between them,
# because pre-commit and prek key an environment on (repo, language, version)
# rather than on the hook, so the compile is paid once for the whole file
# however many ids a repository pins.
#
# The four Go ids at the bottom are the exception, and they are `language:
# system`. They run a consumer's own toolchain over a consumer's own module, so
# there is no uphold code in them and nothing here for a runner to build:
# `language: golang` would have pre-commit install a Go package out of THIS
# repository, which contains none. A repository with Go in it has `go` on PATH
# by definition, and one that does not is told so by the command rather than by
# a build of the wrong thing.

# The declaration check. This fires when the declaration changes or when any
# configuration it reads changes -- the files that can turn a true enforcement
# claim into a false one. It does not run on every commit, and it carries no
# principle text into any runtime: what it prints is the rule that went missing
# and the file that says so.
#
# `language: rust` like every other id here, and it is the same environment.
# This was `language: script` running `uphold_check.py`, which had to
# re-implement `config::load` to know which rules resolve -- a second reader,
# free to disagree with the engine, which it did. The loader answers now. The
# script kept the catalog modes, which read no policy and so cannot disagree.
#
# `.cmd-shims/checks.enabled` left the trigger list with the tier: whether a
# shim is on PATH ahead of the real command is not written in any file a
# repository can be asked, so the reconcile reports that seam as one it could
# not establish rather than reading a file that does not settle it.
- id: uphold-check
  name: uphold
  description: reconcile policy/upheld.toml against the rules this repo actually runs
  entry: uphold check
  language: rust
  stages: [pre-commit, manual]
  pass_filenames: false
  files: '^(policy/upheld\.toml|policy/principles\.toml|\.pre-commit-config\.yaml|lefthook\.yml)$'

# ── the content policy ───────────────────────────────────────────────
#
# One id, where there were two. `uphold-scan` and `uphold-scan-src`
# described a choice between a prebuilt wheel and a source build, and the wheel
# did not exist: this repository publishes no release, and `language: python`
# makes a runner pip-install the CLONE, which with a maturin backend compiles
# from source anyway. So the two ids were one program twice, and the id whose
# name promised the faster path was the one that delivered the slower.
- id: uphold-scan
  name: uphold scan
  description: run the content policy in policy/principles.toml over this repository
  entry: uphold scan
  language: rust
  stages: [pre-commit, manual]
  pass_filenames: false
  always_run: true

# Text that never becomes a file. A commit message is published the moment it is
# written and a tree-scanning check cannot see it at all, so the host-identity
# rules run against the message itself at commit-msg time.
- id: uphold-scan-text
  name: "uphold scan (stage: commit-msg)"
  description: run the host-identity rules over the commit message
  entry: uphold scan --text
  language: rust
  stages: [commit-msg]

# ── the guards ───────────────────────────────────────────────────────
#
# One id per stage, because the stage is an argument and not a detail. A guard
# reads a DIFFERENT artifact at each: the index at pre-commit, the message at
# commit-msg, and at pre-push the commit being pushed together with every blob
# the pushed range introduces -- a file added in one pushed commit and deleted
# in the next is on the remote permanently and is in no tip tree. A single id
# with `stages:` left to the consumer would have to guess which artifact it was
# being asked about, and the guess it would make is the one that reads green.
#
# Which of the eleven guards fires at which stage is not decided here. It is
# decided by `guard::stages` in the binary and by which ids the repository
# declares in policy/principles.toml -- so pinning all five costs nothing for a
# repository that declares two guards, and a repository that declares none gets
# "no guards declared" rather than a failure.

- id: uphold-guard
  name: "uphold guard (stage: pre-commit)"
  description: run the guards that fire at pre-commit -- author identity, staged content, merge commits
  entry: uphold guard --stage pre-commit
  language: rust
  stages: [pre-commit]
  pass_filenames: false
  always_run: true

# `pass_filenames: true`, and it is the one thing here that is easy to get wrong
# in the direction nobody notices. The message is a FILE and the runner knows
# which one; a commit-msg hook declaring `pass_filenames: false` is handed
# nothing and falls back to .git/COMMIT_EDITMSG. Under `git commit` that
# fallback happens to be the right file, which is what makes the mistake
# survivable and therefore permanent -- and it stops being the right file the
# moment anyone drives the hook the other way a runner offers:
#
#   prek run --hook-stage commit-msg --commit-msg-filename <a message file>
#
# With no filename forwarded the guard reads the message left behind by the last
# commit, which is clean, and reports a pass over a file it never opened.
- id: uphold-guard-commit-msg
  name: "uphold guard (stage: commit-msg)"
  description: run the guards that fire at commit-msg -- AI-authorship trailers, unusual unicode, private repo names
  entry: uphold guard --stage commit-msg --message
  language: rust
  stages: [commit-msg]
  pass_filenames: true
  always_run: true

# git runs `pre-merge-commit` for a merge and `pre-commit` for a commit --
# different hook types, installed by different lines -- so a branch carrying a
# zero-width space merges into the trunk with no file guard consulted at all
# unless this id is pinned too.
#
# A FAST-FORWARD merge is not covered and cannot be: git creates no commit for
# one and runs no hook, so there is no moment to refuse at. What arrives that
# way is judged at the next commit or push by the tree-wide guards.
- id: uphold-guard-merge
  name: "uphold guard (stage: pre-merge-commit)"
  description: run the guards that fire at pre-merge-commit
  entry: uphold guard --stage pre-merge-commit
  language: rust
  stages: [pre-merge-commit]
  pass_filenames: false
  always_run: true

# The push guards need to know what is being pushed, and under pre-commit and
# prek that does NOT arrive on stdin -- both consume git's stdin themselves and
# export PRE_COMMIT_FROM_REF, PRE_COMMIT_TO_REF, PRE_COMMIT_REMOTE_NAME and
# PRE_COMMIT_REMOTE_URL instead. The binary reads those, so nothing has to be
# forwarded here. See `runner` for why that is a correctness fix and not a
# convenience: without it a pre-push guard scanned the working index and
# reported on it as though it were the push.
#
# `always_run` with no filenames, for the reason that matters most at this
# stage: a runner passes the files in the push, and a pin file or a policy file
# is almost never one of them. A check that only runs when its own config
# changes is a check that never runs.
- id: uphold-guard-push
  name: "uphold guard (stage: pre-push)"
  description: run the guards that fire at pre-push -- push destination, pushed-range content, stale hook pins
  entry: uphold guard --stage pre-push
  language: rust
  stages: [pre-push]
  pass_filenames: false
  always_run: true

# Five external scanners, one verdict. The scanners are NOT built by this
# hook -- osv-scanner, zizmor, cargo-deny, cargo-vet and guarddog come from
# the host's own toolchain, and one that is missing is exit 2, never a pass.
# At pre-push and manual, not pre-commit: every one of them reaches the
# network, and a check that adds a network round trip to a commit is a check
# somebody switches off. Seven repositories carried this orchestration as a
# ~100-line shell task, near-identical, already drifting; pin this id instead.
- id: uphold-supply-chain
  name: uphold supply-chain
  description: origin, advisories, typosquats and workflow security -- five scanners, one verdict
  entry: uphold supply-chain
  language: rust
  stages: [pre-push, manual]
  pass_filenames: false
  always_run: true

# How CI reaches the guards that are too slow for pre-commit. Both of the
# tree-wide name scans and the pin check ask the forge over the network, once
# per distinct name or pin, which is why they are not registered at commit time
# -- a guard that adds twenty seconds to every commit is one somebody deletes.
# At the manual stage a scheduled run finds them instead of whoever pushes next.
- id: uphold-guard-manual
  name: "uphold guard (stage: manual)"
  description: run the guards that fire at the manual stage, for CI and scheduled runs
  entry: uphold guard --stage manual
  language: rust
  stages: [manual]
  pass_filenames: false
  always_run: true

# ── the Go toolchain ─────────────────────────────────────────────────
#
# Four ids that run no uphold code at all, published here for one reason: a
# fleet audit read 24 sibling repositories side by side and found these four
# declared as `repo: local` entries and hand-copied -- go-test in 24, go-vet in
# 24, gofmt in 24, go-build in 22. Byte-identical apart from one variant, and
# the variant is the whole argument: two of the gofmt copies could never exit
# nonzero, because `gofmt -l` PRINTS the files it would reformat and exits 0
# either way. Twenty-two enforced; two reported "Passed" over unformatted code
# for as long as they existed, and nothing compared a copy against its siblings.
#
# A pinned id can drift in exactly one dimension, the rev, and
# `no-stale-hook-pins` already watches that one. A copied `entry:` line can
# drift in every dimension and nothing watches any of them.
#
# The ids carry the `uphold-` prefix every id in this file carries, even though
# they name no uphold command. hooks/lefthook.yml publishes the same four, and a
# lefthook remote config is MERGED into the consumer's own: two commands sharing
# a name under one hook is one command silently replacing the other, and `gofmt`
# is a name a Go repository has very likely used already. The two files have to
# publish one id list, so the prefix is on both.
#
# `files:` rather than `always_run:`, and that is the whole of "fires in no
# repository without Go in it". The same list is spelled as a `glob:` in
# hooks/lefthook.yml, and the two are meant to be read side by side:
#
#   files: '(\.go|go\.mod|go\.sum)$'   <->   glob: "{*.go,*go.mod,*go.sum}"
#
# They select the same paths, nested ones included, because lefthook's `*`
# crosses a path separator -- and they OVER-select the same way, since a file
# named `cargo.mod` satisfies both. Identical over-selection is the property
# worth having here: two triggers that disagree are the forked copy this whole
# section exists to end, one level up.
#
# `pass_filenames: false` on all four, because not one of these commands takes a
# file list. `./...` is a package pattern and `gofmt -l .` is a walk; handing
# either the staged subset would ask a narrower question than the id names.
#
# `stages: [pre-commit]` and not the `[pre-commit, manual]` every other id here
# carries, which is the one place these four are deliberately narrower than they
# look. Measured against lefthook v2.1.9: `glob` is applied to the files a GIT
# HOOK is running over, and `lefthook run <group>` -- the only manual stage that
# runner has -- has no such set, so every job in the group runs whatever its
# glob says. A Go job reachable that way fires in a repository with no Go in it
# and fails for want of a module. Declaring `manual` here anyway would buy a
# sweep on two runners out of three and make the two published id lists disagree
# about what a pinned id does, which is the failure these ids exist to end.

# The broken copy, written once. `gofmt -l` is a REPORT and not a gate, so the
# EMPTINESS of its output is the verdict and emptiness is what is tested. The
# list is printed before the refusal, because a gate that fails without naming
# what failed is the next one somebody deletes.
- id: uphold-gofmt
  name: gofmt
  description: refuse a tree gofmt would reformat -- the check `gofmt -l` alone cannot make
  entry: sh -c 'unformatted="$(gofmt -l .)"; [ -z "$unformatted" ] || { echo "gofmt would reformat these files; run gofmt -w ."; echo "$unformatted"; exit 1; }'
  language: system
  stages: [pre-commit]
  pass_filenames: false
  files: '(\.go|go\.mod|go\.sum)$'

- id: uphold-go-vet
  name: go vet
  description: run go vet over every package in the module
  entry: go vet ./...
  language: system
  stages: [pre-commit]
  pass_filenames: false
  files: '(\.go|go\.mod|go\.sum)$'

# `-o` into a throwaway directory rather than a bare `go build ./...`, and it is
# not tidiness. Where `./...` resolves to several packages go discards what it
# built, but where it resolves to a SINGLE main package go writes the executable
# into the working directory -- so the hook that checks the tree compiles leaves
# an untracked binary in the tree it just checked, named after the module, in
# exactly the repositories small enough to have one package. The status is
# carried across the cleanup because `rm` succeeding must not become the answer.
- id: uphold-go-build
  name: go build
  description: refuse a module that does not compile, without leaving a binary behind
  entry: sh -c 'out="$(mktemp -d)"; go build -o "$out" ./...; status=$?; rm -rf "$out"; exit $status'
  language: system
  stages: [pre-commit]
  pass_filenames: false
  files: '(\.go|go\.mod|go\.sum)$'

- id: uphold-go-test
  name: go test
  description: run the module's tests
  entry: go test ./...
  language: system
  stages: [pre-commit]
  pass_filenames: false
  files: '(\.go|go\.mod|go\.sum)$'
